name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install CLI dependencies
        run: npm ci

      - name: Run CLI test suite
        run: npm test

  desktop-checks:
    name: Desktop Rust Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: npm --prefix apps/desktop run tauri:check

      - name: Cargo tests
        run: npm --prefix apps/desktop run tauri:test
