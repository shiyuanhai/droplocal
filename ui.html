<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DropLocal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F5F7FB" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("droplocal-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
        } catch (_e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root,
      :root[data-theme="light"] {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-2: #eef2f9;
        --text: #0f172a;
        --muted: #5b6b81;
        --border: #e3e9f2;
        --accent-a: #38bdf8;
        --accent-b: #6366f1;
        --accent: #4f6bf5;
        --success: #10b981;
        --warn: #f59e0b;
        --danger: #e11d48;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.06);
        --overlay: rgba(245, 247, 251, 0.82);
        --toast-bg: #0f172a;
        --toast-text: #f1f5f9;
      }

      :root[data-theme="dark"] {
        --bg: #0b1120;
        --surface: #121a2b;
        --surface-2: #1a2438;
        --text: #e6edf7;
        --muted: #8da2bc;
        --border: #243352;
        --accent-a: #38bdf8;
        --accent-b: #818cf8;
        --accent: #6d8bff;
        --success: #34d399;
        --warn: #fbbf24;
        --danger: #fb7185;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
        --overlay: rgba(11, 17, 32, 0.85);
        --toast-bg: #e6edf7;
        --toast-text: #0b1120;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: var(--text);
        background:
          radial-gradient(circle at 0% -10%, rgba(56, 189, 248, 0.08), transparent 36%),
          radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.07), transparent 40%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
        overflow-wrap: anywhere;
      }

      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 760px;
        margin: 0 auto;
      }

      /* ---------- Header ---------- */

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand svg {
        flex: 0 0 auto;
      }

      .brand-title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
        flex: 0 0 auto;
      }

      .status[data-state="live"] .status-dot {
        background: var(--success);
      }

      .status[data-state="offline"] .status-dot {
        background: var(--danger);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .icon-btn:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      .icon-btn[aria-pressed="true"] {
        background: var(--surface-2);
        color: var(--accent);
      }

      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: transparent;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        padding: 8px 10px;
        cursor: pointer;
      }

      .lang-select:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      /* ---------- Connect card ---------- */

      .connect-card {
        display: flex;
        gap: 18px;
        align-items: center;
        margin: 4px 16px 10px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        position: relative;
      }

      .connect-card[hidden] {
        display: none;
      }

      .qr-box {
        flex: 0 0 auto;
        width: 148px;
        height: 148px;
        padding: 10px;
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
      }

      .qr-box svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .connect-info {
        min-width: 0;
        flex: 1;
      }

      .connect-title {
        margin: 0 0 4px;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .connect-hint {
        margin: 0 0 10px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .url-row {
        display: flex;
        gap: 8px;
        align-items: stretch;
        min-width: 0;
      }

      .share-url {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface-2);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.84rem;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      .pill-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface);
        padding: 9px 14px;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .pill-btn:hover {
        background: var(--surface-2);
      }

      .connect-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        border-radius: 9px;
      }

      .connect-alt {
        margin: 8px 0 0;
        font-size: 0.74rem;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @media (max-width: 559px) {
        .connect-card {
          flex-direction: column;
          gap: 12px;
          text-align: center;
        }

        .url-row {
          flex-direction: column;
        }

        .connect-card .connect-hint {
          margin-bottom: 6px;
        }
      }

      /* ---------- Selection bar ---------- */

      .select-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 16px 10px;
        padding: 8px 8px 8px 14px;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .select-bar[hidden] {
        display: none;
      }

      .select-count {
        font-size: 0.84rem;
        font-weight: 700;
      }

      .select-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .pill-btn.accent {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        color: #fff;
      }

      .pill-btn.accent:hover {
        opacity: 0.93;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      }

      /* ---------- Stream ---------- */

      .stream-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 16px 12px;
        scrollbar-width: thin;
      }

      .stream {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 14vh 24px 0;
      }

      .empty-state svg {
        opacity: 0.35;
        margin-bottom: 10px;
      }

      .empty-title {
        margin: 0 0 6px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
      }

      .empty-body {
        margin: 0 auto;
        max-width: 360px;
        font-size: 0.86rem;
      }

      .item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        animation: item-in 0.22s ease;
      }

      @keyframes item-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      .item-icon {
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      }

      .item-icon.kind-text {
        background: var(--surface-2);
        color: var(--accent);
      }

      button.item-icon {
        border: none;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.15s ease;
      }

      button.item-icon:hover {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
      }

      button.item-icon:active {
        transform: scale(0.94);
      }

      .item.selected {
        border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
        background: color-mix(in srgb, var(--accent) 6%, var(--surface));
      }

      .item-main {
        flex: 1;
        min-width: 0;
      }

      .item-text {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 132px;
        overflow: hidden;
      }

      .item.expanded .item-text {
        max-height: none;
      }

      .expand-btn {
        margin-top: 4px;
        padding: 0;
        border: none;
        background: none;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
      }

      .item-name {
        margin: 0;
        font-weight: 600;
        word-break: break-word;
      }

      .item-meta {
        margin: 2px 0 0;
        font-size: 0.76rem;
        color: var(--muted);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .item-actions {
        flex: 0 0 auto;
        display: flex;
        gap: 2px;
      }

      .item-actions .icon-btn {
        width: 34px;
        height: 34px;
      }

      .icon-btn.danger:hover {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 12%, transparent);
      }

      .icon-btn.ok {
        color: var(--success);
      }

      a.icon-btn {
        text-decoration: none;
      }

      .progress-track {
        margin-top: 8px;
        height: 6px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
        transition: width 0.2s ease;
      }

      /* ---------- Share bar ---------- */

      .sharebar {
        padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
      }

      .sharebar-inner {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .sharebar-inner:focus-within {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      }

      .share-input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        resize: none;
        max-height: 132px;
        padding: 8px 2px;
        line-height: 1.45;
      }

      .share-input::placeholder {
        color: var(--muted);
      }

      .send-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: none;
        border-radius: 13px;
        min-width: 42px;
        height: 42px;
        padding: 0 16px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }

      .send-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .send-btn:not(:disabled):active {
        transform: scale(0.97);
      }

      .share-foot {
        margin: 8px 4px 0;
        text-align: center;
        font-size: 0.72rem;
        color: var(--muted);
      }

      @media (max-width: 419px) {
        .send-label {
          display: none;
        }

        .send-btn {
          padding: 0 13px;
        }

        .share-foot {
          display: none;
        }
      }

      /* ---------- Overlay, toast ---------- */

      .drop-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: var(--overlay);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .drop-overlay[hidden] {
        display: none;
      }

      .drop-overlay-inner {
        pointer-events: none;
        text-align: center;
        color: var(--accent);
        font-size: 1.1rem;
        font-weight: 700;
        border: 2px dashed var(--accent);
        border-radius: 24px;
        padding: 48px 56px;
      }

      .pin-gate {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: grid;
        place-items: center;
        background: var(--overlay);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 24px;
      }

      .pin-gate[hidden] {
        display: none;
      }

      .pin-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: min(340px, 100%);
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .pin-title {
        margin: 4px 0 0;
        font-size: 1.05rem;
      }

      .pin-body {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .pin-input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface-2);
        padding: 11px 14px;
        font-size: 1.1rem;
        text-align: center;
        letter-spacing: 0.3em;
        outline: none;
      }

      .pin-input:focus {
        border-color: var(--accent);
      }

      .pin-card .send-btn {
        width: 100%;
      }

      .pin-error {
        margin: 0;
        color: var(--danger);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .item-text a {
        color: var(--accent);
        word-break: break-all;
      }

      /* markdown rendering inside notes */
      .item-text h1,
      .item-text h2,
      .item-text h3 {
        margin: 0 0 4px;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .item-text h1 {
        font-size: 1.08rem;
      }

      .item-text h2 {
        font-size: 1rem;
      }

      .item-text h3 {
        font-size: 0.94rem;
      }

      .item-text p {
        margin: 0 0 6px;
      }

      .item-text > :last-child {
        margin-bottom: 0;
      }

      .item-text ul,
      .item-text ol {
        margin: 0 0 6px;
        padding-left: 20px;
        white-space: normal;
      }

      .item-text code {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85em;
      }

      .item-text pre {
        margin: 0 0 6px;
        padding: 10px 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        line-height: 1.45;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(86px + env(safe-area-inset-bottom));
        transform: translate(-50%, 12px);
        z-index: 60;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--toast-bg);
        color: var(--toast-text);
        font-size: 0.84rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
        max-width: min(86vw, 480px);
        text-align: center;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (min-width: 760px) {
        .topbar,
        .stream-wrap,
        .sharebar {
          padding-left: 20px;
          padding-right: 20px;
        }

        .connect-card {
          margin-left: 20px;
          margin-right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <section class="brand">
          <svg width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="hg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/>
              </linearGradient>
            </defs>
            <path d="M32 4.5 C32 4.5 11.5 28 11.5 41 a20.5 20.5 0 0 0 41 0 C52.5 28 32 4.5 32 4.5 Z" fill="url(#hg)"/>
            <path d="M32 27.5 v15 M23 36 L32 45 41 36" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <div>
            <h1 class="brand-title">DropLocal</h1>
            <div class="status" id="status" data-state="connecting">
              <span class="status-dot"></span>
              <span id="statusText"></span>
            </div>
          </div>
        </section>
        <section class="top-actions">
          <button class="icon-btn" id="connectToggle" type="button" aria-pressed="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14h1M14 20h1M20 20h1"/></svg>
          </button>
          <select class="lang-select" id="langSelect">
            <option value="en">EN</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
          </select>
          <button class="icon-btn" id="themeToggle" type="button"></button>
        </section>
      </header>

      <section class="connect-card" id="connectCard" hidden>
        <div class="qr-box" id="qrBox" hidden></div>
        <div class="connect-info">
          <h2 class="connect-title" data-i18n="connect.title"></h2>
          <p class="connect-hint" data-i18n="connect.hint"></p>
          <div class="url-row">
            <code class="share-url" id="shareUrl">…</code>
            <button class="pill-btn" id="copyUrlBtn" type="button" data-i18n="connect.copy"></button>
          </div>
          <p class="connect-alt" id="connectAlt" hidden></p>
        </div>
        <button class="icon-btn connect-close" id="connectClose" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </section>

      <div class="select-bar" id="selectBar" hidden>
        <span class="select-count" id="selectCount"></span>
        <div class="select-actions">

          video: ["mp4", "mov", "webm", "mkv", "avi", "m4v"],

          archive: ["zip", "rar", "7z", "tar", "gz", "bz2", "xz", "dmg", "iso"],
          code: ["js", "ts", "jsx", "tsx", "py", "rs", "go", "java", "c", "h", "cpp", "cs", "html", "css", "json", "yml", "yaml", "toml", "sh", "rb", "swift", "kt", "sql"],
          doc: ["pdf", "doc", "docx", "txt", "md", "rtf", "pages", "xls", "xlsx", "csv", "ppt", "pptx", "key", "numbers", "epub"]
        };

        function fileIcon(name) {
          var ext = String(name || "").split(".").pop().toLowerCase();
          for (var kind in EXT_KIND) {
            if (EXT_KIND[kind].indexOf(ext) !== -1) {
              return ICONS[kind];
            }
          }
          return ICONS.file;
        }

        /* ---------- rendering ---------- */

        function renderStatus() {
          refs.status.dataset.state = state.wsState;
          if (state.wsState === "connecting") {
            refs.statusText.textContent = t("status.connecting");
          } else if (state.wsState === "offline") {
            refs.statusText.textContent = t("status.offline");
          } else {
            var devices =
              state.deviceCount === 1
                ? t("status.devices.one")
                : t("status.devices.other", { count: state.deviceCount });
            refs.statusText.textContent = t("status.live") + " · " + devices;
          }
        }

        function iconButton(label, svg, extraClass) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "icon-btn" + (extraClass ? " " + extraClass : "");
          button.setAttribute("aria-label", label);
          button.title = label;
          button.innerHTML = svg;
          return button;
        }

        function flashCheck(button, originalSvg) {
          button.innerHTML = ICONS.check;
          button.classList.add("ok");
          window.setTimeout(function () {
            button.innerHTML = originalSvg;
            button.classList.remove("ok");
          }, 1400);
        }

        var URL_PATTERN = /(https?:\/\/[^\s<>"']+)/g;
        var MD_PATTERN = /(^|\n)(#{1,3} |[-*] |\d+\. )|```|\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\//;

        /* ---------- markdown (safe subset, DOM-built) ---------- */

        var INLINE_PATTERNS = [
          {
            re: /`([^`]+)`/,
            make: function (match) {
              var code = document.createElement("code");
              code.textContent = match[1];
              return code;
            }
          },
          {
            re: /\*\*([^*]+)\*\*/,
            make: function (match) {
              var strong = document.createElement("strong");
              appendInline(strong, match[1]);
              return strong;
            }
          },
          {
            re: /\*([^*\s][^*]*)\*/,
            make: function (match) {
              var em = document.createElement("em");
              appendInline(em, match[1]);
              return em;
            }
          },
          {
            re: /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/,
            make: function (match) {
              var anchor = document.createElement("a");
              anchor.href = match[2];
              anchor.target = "_blank";
              anchor.rel = "noopener noreferrer";
              anchor.textContent = match[1];
              return anchor;
            }
          }
        ];

        function appendInline(node, text) {
          var remaining = text;
          while (remaining) {
            var best = null;
            for (var i = 0; i < INLINE_PATTERNS.length; i += 1) {
              var match = INLINE_PATTERNS[i].re.exec(remaining);
              if (match && (best === null || match.index < best.match.index)) {
                best = { pattern: INLINE_PATTERNS[i], match: match };
              }
            }
            if (!best) {
              appendLinkified(node, remaining);
              return;
            }
            if (best.match.index > 0) {
              appendLinkified(node, remaining.slice(0, best.match.index));
            }
            node.appendChild(best.pattern.make(best.match));
            remaining = remaining.slice(best.match.index + best.match[0].length);
          }
        }

        function renderMarkdownBlocks(container, text) {
          var lines = text.split("\n");
          var paragraph = [];
          var list = null;

          function flushParagraph() {
            if (paragraph.length) {
              var p = document.createElement("p");
              appendInline(p, paragraph.join("\n"));
              container.appendChild(p);
              paragraph = [];
            }
          }

          function flushList() {
            if (list) {
              container.appendChild(list.el);
              list = null;
            }
          }

          for (var i = 0; i < lines.length; i += 1) {
            var line = lines[i];
            var heading = line.match(/^(#{1,3})\s+(.*)/);
            var bullet = line.match(/^[-*]\s+(.*)/);
            var numbered = line.match(/^\d+\.\s+(.*)/);

            if (heading) {
              flushParagraph();
              flushList();
              var headingEl = document.createElement("h" + heading[1].length);
              appendInline(headingEl, heading[2]);
              container.appendChild(headingEl);
            } else if (bullet || numbered) {
              flushParagraph();
              var type = bullet ? "ul" : "ol";
              if (!list || list.type !== type) {
                flushList();
                list = { type: type, el: document.createElement(type) };
              }
              var item = document.createElement("li");
              appendInline(item, (bullet || numbered)[1]);
              list.el.appendChild(item);
            } else if (!line.trim()) {
              flushParagraph();
              flushList();
            } else {
              flushList();
              paragraph.push(line);
            }
          }
          flushParagraph();
          flushList();
        }

        function renderRichText(container, raw) {
          var segments = String(raw).split("```");
          for (var i = 0; i < segments.length; i += 1) {
            if (i % 2 === 1) {
              var code = segments[i];
              var newline = code.indexOf("\n");
              if (newline > -1 && /^[\w+-]*\s*$/.test(code.slice(0, newline))) {
                code = code.slice(newline + 1);
              }
              var pre = document.createElement("pre");
              pre.textContent = code.replace(/\n$/, "");
              container.appendChild(pre);
            } else if (segments[i]) {
              renderMarkdownBlocks(container, segments[i]);
            }
          }
        }

        function appendLinkified(container, value) {
          var parts = String(value).split(URL_PATTERN);
          for (var i = 0; i < parts.length; i += 1) {
            if (i % 2 === 1) {
              var anchor = document.createElement("a");
              anchor.href = parts[i];
              anchor.textContent = parts[i];
              anchor.target = "_blank";
              anchor.rel = "noopener noreferrer";
              container.appendChild(anchor);
            } else if (parts[i]) {
              container.appendChild(document.createTextNode(parts[i]));
            }
          }
        }

        function buildTextItem(item) {
          var li = document.createElement("li");
          li.className = "item" + (state.expanded.has(item.id) ? " expanded" : "");
          li.dataset.id = item.id;

          var icon = document.createElement("div");
          icon.className = "item-icon kind-text";
          icon.innerHTML = ICONS.note;

          var main = document.createElement("div");
          main.className = "item-main";

          var text = document.createElement("div");
          text.className = "item-text";
          if (MD_PATTERN.test(item.text)) {
            renderRichText(text, item.text);
          } else {
            appendLinkified(text, item.text);
          }
          main.appendChild(text);

          if (item.text.length > 280 || item.text.split("\n").length > 6) {
            var expand = document.createElement("button");
            expand.type = "button";
            expand.className = "expand-btn";
            expand.textContent = t(state.expanded.has(item.id) ? "item.less" : "item.more");
            expand.addEventListener("click", function () {
              if (state.expanded.has(item.id)) {
                state.expanded.delete(item.id);
              } else {
                state.expanded.add(item.id);
              }
              renderStream();
            });
            main.appendChild(expand);
          }

          var meta = document.createElement("p");
          meta.className = "item-meta";
          var time = document.createElement("span");
          time.className = "item-time";
          time.dataset.ts = item.timestamp;
          time.textContent = formatRelativeTime(item.timestamp);
          meta.appendChild(time);
          main.appendChild(meta);

          var actions = document.createElement("div");
          actions.className = "item-actions";

          var copyBtn = iconButton(t("item.copy"), ICONS.copy);
          copyBtn.addEventListener("click", function () {
            copyText(item.text, function (ok) {
              if (ok) {
                flashCheck(copyBtn, ICONS.copy);
              } else {
                showToast(t("toast.copyFailed"));
              }
            });
          });

          var deleteBtn = iconButton(t("item.delete"), ICONS.trash, "danger");
          deleteBtn.addEventListener("click", function () {
            deleteItem(item);
          });

          actions.appendChild(copyBtn);
          actions.appendChild(deleteBtn);

          li.appendChild(icon);
          li.appendChild(main);
          li.appendChild(actions);
          return li;
        }

        function buildFileItem(item) {
          var isSelected = state.selected.has(item.id);
          var li = document.createElement("li");
          li.className = "item" + (isSelected ? " selected" : "");
          li.dataset.id = item.id;

          var icon = document.createElement("button");
          icon.type = "button";
          icon.className = "item-icon";
          icon.setAttribute("aria-pressed", String(isSelected));
          icon.setAttribute("aria-label", t("item.select"));
          icon.title = t("item.select");
          icon.innerHTML = isSelected ? ICONS.check : fileIcon(item.name);
          icon.addEventListener("click", function () {
            if (state.selected.has(item.id)) {
              state.selected.delete(item.id);
            } else {
              state.selected.add(item.id);
            }
            renderStream();
          });

          var main = document.createElement("div");
          main.className = "item-main";

          var name = document.createElement("p");
          name.className = "item-name";
          name.textContent = item.name;
          main.appendChild(name);

          var meta = document.createElement("p");
          meta.className = "item-meta";
          var size = document.createElement("span");
          size.textContent = formatSize(item.size);
          var dot = document.createElement("span");
          dot.textContent = "·";
          var time = document.createElement("span");
          time.className = "item-time";
          time.dataset.ts = item.timestamp;
          time.textContent = formatRelativeTime(item.timestamp);
          meta.appendChild(size);
          meta.appendChild(dot);
          meta.appendChild(time);
          main.appendChild(meta);

          var actions = document.createElement("div");
          actions.className = "item-actions";

          var downloadLink = document.createElement("a");
          downloadLink.className = "icon-btn";
          downloadLink.href = "/api/files/" + encodeURIComponent(item.id);
          downloadLink.setAttribute("download", item.name);
          downloadLink.setAttribute("aria-label", t("item.download"));
          downloadLink.title = t("item.download");
          downloadLink.innerHTML = ICONS.download;

          var deleteBtn = iconButton(t("item.delete"), ICONS.trash, "danger");
          deleteBtn.addEventListener("click", function () {
            deleteItem(item);
          });

          actions.appendChild(downloadLink);
          actions.appendChild(deleteBtn);

          li.appendChild(icon);
          li.appendChild(main);
          li.appendChild(actions);
          return li;
        }

        function buildUploadItem(upload, uploadId) {
          var li = document.createElement("li");
          li.className = "item";

          var icon = document.createElement("div");
          icon.className = "item-icon";
          icon.innerHTML = fileIcon(upload.name);

          var main = document.createElement("div");
          main.className = "item-main";

          var name = document.createElement("p");
          name.className = "item-name";
          name.textContent = upload.name;
          main.appendChild(name);

          var meta = document.createElement("p");
          meta.className = "item-meta";
          meta.textContent = t("item.uploading") + " " + Math.round(upload.progress * 100) + "%";
          main.appendChild(meta);

          var track = document.createElement("div");
          track.className = "progress-track";
          var fill = document.createElement("div");
          fill.className = "progress-fill";
          fill.style.width = Math.round(upload.progress * 100) + "%";
          track.appendChild(fill);
          main.appendChild(track);

          var actions = document.createElement("div");
          actions.className = "item-actions";
          var cancelBtn = iconButton(t("item.cancel"), ICONS.trash, "danger");
          cancelBtn.addEventListener("click", function () {
            var entry = state.uploads.get(uploadId);
            if (entry && entry.xhr) {
              entry.xhr.abort();
            }
            state.uploads.delete(uploadId);
            renderStream();
          });
          actions.appendChild(cancelBtn);

          li.appendChild(icon);
          li.appendChild(main);
          li.appendChild(actions);
          return li;
        }

        function renderSelectBar() {
          // Selection can only contain files that still exist.
          state.selected.forEach(function (id) {
            var item = state.items.get(id);
            if (!item || item.kind !== "file") {
              state.selected.delete(id);
            }
          });

          var count = state.selected.size;
          refs.selectBar.hidden = count === 0;
          if (count > 0) {
            refs.selectCount.textContent = t("sel.count", { count: count });
          }
        }

        function renderStream() {
          var entries = Array.from(state.items.values());
          entries.sort(function (left, right) {
            return String(right.timestamp).localeCompare(String(left.timestamp));
          });

          renderSelectBar();
          refs.stream.textContent = "";

          state.uploads.forEach(function (upload, uploadId) {
            refs.stream.appendChild(buildUploadItem(upload, uploadId));
          });

          entries.forEach(function (item) {
            refs.stream.appendChild(item.kind === "text" ? buildTextItem(item) : buildFileItem(item));
          });

          refs.emptyState.hidden = state.items.size > 0 || state.uploads.size > 0;
        }

        function refreshTimes() {
          var nodes = document.querySelectorAll(".item-time[data-ts]");
          for (var i = 0; i < nodes.length; i += 1) {
            nodes[i].textContent = formatRelativeTime(nodes[i].dataset.ts);
          }
        }

        /* ---------- data ---------- */

        function addSnippet(snippet) {
          state.items.set(snippet.id, {
            id: snippet.id,
            kind: "text",
            text: snippet.text,
            timestamp: snippet.timestamp
          });
        }

        function addFile(meta) {
          state.items.set(meta.id, {
            id: meta.id,
            kind: "file",
            name: meta.name,
            size: meta.size,
            timestamp: meta.timestamp
          });
        }

        function setLocked(locked) {
          state.locked = locked;
          refs.pinGate.hidden = !locked;
          if (locked) {
            refs.pinInput.focus();
          }
        }

        function loadInitial() {
          Promise.all([fetch("/api/snippets"), fetch("/api/files")])
            .then(function (responses) {
              if (responses.some(function (r) { return r.status === 401; })) {
                setLocked(true);
                return null;
              }
              return Promise.all(
                responses.map(function (r) { return r.ok ? r.json() : []; })
              );
            })
            .then(function (results) {
              if (!results) {
                return;
              }
              results[0].forEach(addSnippet);
              results[1].forEach(addFile);
              renderStream();
            })
            .catch(function () {
              renderStream();
            });
        }

        function submitPin(event) {
          event.preventDefault();
          var pin = refs.pinInput.value.trim();
          if (!pin) {
            return;
          }
          fetch("/api/auth", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ pin: pin })
          })
            .then(function (response) {
              if (response.ok) {
                refs.pinError.hidden = true;
                refs.pinInput.value = "";
                setLocked(false);
                loadInitial();
                connectSocket();
                refreshConnectInfo();
              } else {
                refs.pinError.hidden = false;
                refs.pinInput.select();
              }
            })
            .catch(function () {
              refs.pinError.hidden = false;
            });
        }

        function deleteItem(item) {
          var endpoint = item.kind === "text" ? "/api/snippets/" : "/api/files/";
          fetch(endpoint + encodeURIComponent(item.id), { method: "DELETE" })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("delete failed");
              }
              state.items.delete(item.id);
              renderStream();
            })
            .catch(function () {
              showToast(t("toast.deleteFailed"));
            });
        }

        function sendText() {
          var text = refs.shareInput.value.trim();
          if (!text) {
            return;
          }
          refs.sendBtn.disabled = true;
          fetch("/api/snippets", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text: text })
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("send failed");
              }
              return response.json();
            })
            .then(function (snippet) {
              addSnippet(snippet);
              renderStream();
              refs.shareInput.value = "";
              autogrow();
              refs.shareInput.focus();
            })
            .catch(function () {
              showToast(t("toast.sendFailed"));
            })
            .finally(function () {
              updateSendState();
            });
        }

        function uploadFile(file, displayName) {
          var name = displayName || file.name || "file";
          var uploadId = "upload-" + Date.now() + "-" + Math.random().toString(36).slice(2);

          var formData = new FormData();
          formData.append("file", file, name);

          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/files");
          state.uploads.set(uploadId, { name: name, progress: 0, xhr: xhr });
          renderStream();

          xhr.addEventListener("abort", function () {
            state.uploads.delete(uploadId);
            renderStream();
          });

          xhr.upload.addEventListener("progress", function (event) {
            if (event.lengthComputable) {
              var entry = state.uploads.get(uploadId);
              if (entry) {
                entry.progress = event.loaded / event.total;
                renderStream();
              }
            }
          });

          xhr.addEventListener("load", function () {
            state.uploads.delete(uploadId);
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                var payload = JSON.parse(xhr.responseText);
                (Array.isArray(payload) ? payload : [payload]).forEach(addFile);
              } catch (_e) {}
            } else {
              showToast(t("toast.uploadFailed", { name: name }));
            }
            renderStream();
          });

          xhr.addEventListener("error", function () {
            state.uploads.delete(uploadId);
            showToast(t("toast.uploadFailed", { name: name }));
            renderStream();
          });

          xhr.send(formData);
        }

        function uploadFiles(fileList) {
          Array.prototype.forEach.call(fileList, function (file) {
            uploadFile(file);
          });
        }

        /* ---------- websocket ---------- */

        function connectSocket() {
          if (state.locked) {
            return;
          }
          var protocol = location.protocol === "https:" ? "wss" : "ws";
          var socket = new WebSocket(protocol + "://" + location.host + "/ws");
          state.ws = socket;

          socket.addEventListener("open", function () {
            state.wsAttempts = 0;
            state.wsState = "live";
            renderStatus();
          });

          socket.addEventListener("message", function (event) {
            var envelope;
            try {
              envelope = JSON.parse(event.data);
            } catch (_e) {
              return;
            }

            if (envelope.event === "device:count") {
              state.deviceCount = envelope.data.count;
              renderStatus();
            } else if (envelope.event === "snippet:new") {
              addSnippet(envelope.data);
              renderStream();
            } else if (envelope.event === "snippet:delete") {
              state.items.delete(envelope.data.id);
              renderStream();
            } else if (envelope.event === "file:new") {
              addFile(envelope.data);
              renderStream();
            } else if (envelope.event === "file:delete") {
              state.items.delete(envelope.data.id);
              renderStream();
            }
          });

          socket.addEventListener("close", function () {
            if (state.locked) {
              return;
            }
            state.wsState = "offline";
            renderStatus();
            state.wsAttempts += 1;
            var delay = Math.min(1000 * Math.pow(2, state.wsAttempts), 8000);
            window.setTimeout(connectSocket, delay);
          });

          socket.addEventListener("error", function () {
            socket.close();
          });
        }

        /* ---------- connect card ---------- */

        function isLoopbackHost(hostname) {
          return (
            hostname === "localhost" ||
            hostname === "127.0.0.1" ||
            hostname === "[::1]" ||
            hostname.indexOf("127.") === 0
          );
        }

        function setConnectOpen(open) {
          refs.connectCard.hidden = !open;
          refs.connectToggle.setAttribute("aria-pressed", String(open));
          try {
            localStorage.setItem("droplocal-connect", open ? "open" : "closed");
          } catch (_e) {}
        }

        function renderQr(url) {
          if (typeof qrcode !== "function") {
            refs.qrBox.hidden = true;
            return;
          }
          try {
            var qr = qrcode(0, "M");
            qr.addData(url);
            qr.make();
            refs.qrBox.innerHTML = qr.createSvgTag(4, 0);
            refs.qrBox.hidden = false;
          } catch (_e) {
            refs.qrBox.hidden = true;
          }
        }

        function setupConnectCard() {
          var stored = "open";
          try {
            stored = localStorage.getItem("droplocal-connect") || "open";
          } catch (_e) {}
          setConnectOpen(stored !== "closed");

          var fallbackUrl = location.origin;
          state.shareUrl = fallbackUrl;
          refs.shareUrl.textContent = fallbackUrl.replace(/^http:\/\//, "");
          if (!isLoopbackHost(location.hostname)) {
            renderQr(fallbackUrl);
          }

          refreshConnectInfo();
        }

        function refreshConnectInfo() {
          fetch("/api/info")
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .then(function (info) {
              if (!info || !info.urls || !info.urls.primary) {
                return;
              }
              var ipUrl = isLoopbackHost(location.hostname) ? info.urls.primary : location.origin;
              var displayUrl = info.urls.friendly || ipUrl;
              state.shareUrl = displayUrl;
              refs.shareUrl.textContent = displayUrl.replace(/^http:\/\//, "");
              // The QR always encodes the IP URL — Android browsers can't
              // reliably resolve .local names.
              renderQr(ipUrl);
              if (info.urls.friendly && info.urls.friendly !== ipUrl) {
                refs.connectAlt.textContent = ipUrl.replace(/^http:\/\//, "");
                refs.connectAlt.hidden = false;
              } else {
                refs.connectAlt.hidden = true;
              }
            })
            .catch(function () {});
        }

        /* ---------- share input ---------- */

        function autogrow() {
          refs.shareInput.style.height = "auto";
          refs.shareInput.style.height = Math.min(refs.shareInput.scrollHeight, 132) + "px";
        }

        function updateSendState() {
          refs.sendBtn.disabled = refs.shareInput.value.trim().length === 0;
        }

        /* ---------- drag & drop / paste ---------- */

        var dragDepth = 0;

        function hasFiles(event) {
          var types = event.dataTransfer && event.dataTransfer.types;
          return Boolean(types && Array.prototype.indexOf.call(types, "Files") !== -1);
        }

        function setupDragDrop() {
          document.addEventListener("dragenter", function (event) {
            if (!hasFiles(event)) {
              return;
            }
            event.preventDefault();
            dragDepth += 1;
            refs.dropOverlay.hidden = false;
          });

          document.addEventListener("dragover", function (event) {
            if (hasFiles(event)) {
              event.preventDefault();
            }
          });

          document.addEventListener("dragleave", function (event) {
            if (!hasFiles(event)) {
              return;
            }
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) {
              refs.dropOverlay.hidden = true;
            }
          });

          document.addEventListener("drop", function (event) {
            if (!hasFiles(event)) {
              return;
            }
            event.preventDefault();
            dragDepth = 0;
            refs.dropOverlay.hidden = true;
            if (event.dataTransfer.files.length) {
              uploadFiles(event.dataTransfer.files);
            }
          });
        }

        function setupPaste() {
          document.addEventListener("paste", function (event) {
            var clipboard = event.clipboardData;
            if (!clipboard) {
              return;
            }

            var imageItems = [];
            for (var i = 0; i < clipboard.items.length; i += 1) {
              var entry = clipboard.items[i];
              if (entry.kind === "file" && entry.type.indexOf("image/") === 0) {
                imageItems.push(entry);
              }
            }

            if (imageItems.length) {
              event.preventDefault();
              imageItems.forEach(function (entry, index) {
                var blob = entry.getAsFile();
                if (!blob) {
                  return;
                }
                var ext = (blob.type.split("/")[1] || "png").replace("jpeg", "jpg");
                var stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
                var suffix = imageItems.length > 1 ? "-" + (index + 1) : "";
                uploadFile(blob, blob.name && blob.name !== "image.png" ? blob.name : "screenshot-" + stamp + suffix + "." + ext);
              });
              showToast(t("toast.screenshot"));
              return;
            }

            if (document.activeElement !== refs.shareInput) {
              var text = clipboard.getData("text/plain");
              if (text) {
                event.preventDefault();
                refs.shareInput.value = refs.shareInput.value
                  ? refs.shareInput.value + "\n" + text
                  : text;
                refs.shareInput.focus();
                autogrow();
                updateSendState();
              }
            }
          });
        }

        /* ---------- wiring ---------- */

        function setupEvents() {
          refs.themeToggle.addEventListener("click", function () {
            var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            applyTheme(next);
          });

          refs.langSelect.addEventListener("change", function () {
            applyLang(refs.langSelect.value);
          });

          refs.connectToggle.addEventListener("click", function () {
            setConnectOpen(refs.connectCard.hidden);
          });

          refs.connectClose.addEventListener("click", function () {
            setConnectOpen(false);
          });

          refs.copyUrlBtn.addEventListener("click", function () {
            copyText(state.shareUrl, function (ok) {
              if (ok) {
                refs.copyUrlBtn.textContent = t("connect.copied");
                window.setTimeout(function () {
                  refs.copyUrlBtn.textContent = t("connect.copy");
                }, 1400);
              } else {
                showToast(t("toast.copyFailed"));
              }
            });
          });

          refs.attachBtn.addEventListener("click", function () {
            refs.fileInput.click();
          });

          refs.fileInput.addEventListener("change", function () {
            if (refs.fileInput.files.length) {
              uploadFiles(refs.fileInput.files);
              refs.fileInput.value = "";
            }
          });

          refs.sendBtn.addEventListener("click", sendText);

          refs.shareInput.addEventListener("input", function () {
            autogrow();
            updateSendState();
          });

          refs.shareInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
              event.preventDefault();
              sendText();
            }
          });

          refs.pinForm.addEventListener("submit", submitPin);

          refs.selectAllBtn.addEventListener("click", function () {
            state.items.forEach(function (item) {
              if (item.kind === "file") {
                state.selected.add(item.id);
              }
            });
            renderStream();
          });

          refs.selectClearBtn.addEventListener("click", function () {
            state.selected.clear();
            renderStream();
          });

          refs.zipBtn.addEventListener("click", function () {
            var ids = Array.from(state.selected);
            if (!ids.length) {
              return;
            }
            var anchor = document.createElement("a");
            anchor.href = "/api/files.zip?ids=" + ids.join(",");
            anchor.download = "";
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            state.selected.clear();
            renderStream();
          });

          window.setInterval(refreshTimes, 30000);
        }

        /* ---------- init ---------- */

        applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
        applyLang(detectLang());
        setupConnectCard();
        setupEvents();
        setupDragDrop();
        setupPaste();
        loadInitial();
        connectSocket();
        updateSendState();
      })();
    </script>
  </body>
</html>
