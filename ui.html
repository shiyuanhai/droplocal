<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DropLocal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F5F7FB" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("droplocal-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
        } catch (_e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root,
      :root[data-theme="light"] {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-2: #eef2f9;
        --text: #0f172a;
        --muted: #5b6b81;
        --border: #e3e9f2;
        --accent-a: #38bdf8;
        --accent-b: #6366f1;
        --accent: #4f6bf5;
        --success: #10b981;
        --warn: #f59e0b;
        --danger: #e11d48;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 8px 24px rgba(15, 23, 42, 0.06);
        --overlay: rgba(245, 247, 251, 0.82);
        --toast-bg: #0f172a;
        --toast-text: #f1f5f9;
      }

      :root[data-theme="dark"] {
        --bg: #0b1120;
        --surface: #121a2b;
        --surface-2: #1a2438;
        --text: #e6edf7;
        --muted: #8da2bc;
        --border: #243352;
        --accent-a: #38bdf8;
        --accent-b: #818cf8;
        --accent: #6d8bff;
        --success: #34d399;
        --warn: #fbbf24;
        --danger: #fb7185;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
        --overlay: rgba(11, 17, 32, 0.85);
        --toast-bg: #e6edf7;
        --toast-text: #0b1120;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: var(--text);
        background:
          radial-gradient(circle at 0% -10%, rgba(56, 189, 248, 0.08), transparent 36%),
          radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.07), transparent 40%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
        overflow-wrap: anywhere;
      }

      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 760px;
        margin: 0 auto;
      }

      /* ---------- Header ---------- */

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand svg {
        flex: 0 0 auto;
      }

      .brand-title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
        flex: 0 0 auto;
      }

      .status[data-state="live"] .status-dot {
        background: var(--success);
      }

      .status[data-state="offline"] .status-dot {
        background: var(--danger);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .icon-btn:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      .icon-btn[aria-pressed="true"] {
        background: var(--surface-2);
        color: var(--accent);
      }

      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: transparent;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        padding: 8px 10px;
        cursor: pointer;
      }

      .lang-select:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      /* ---------- Connect card ---------- */

      .connect-card {
        display: flex;
        gap: 18px;
        align-items: center;
        margin: 4px 16px 10px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        position: relative;
      }

      .connect-card[hidden] {
        display: none;
      }

      .qr-box {
        flex: 0 0 auto;
        width: 148px;
        height: 148px;
        padding: 10px;
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
      }

      .qr-box svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .connect-info {
        min-width: 0;
        flex: 1;
      }

      .connect-title {
        margin: 0 0 4px;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .connect-hint {
        margin: 0 0 10px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .url-row {
        display: flex;
        gap: 8px;
        align-items: stretch;
        min-width: 0;
      }

      .share-url {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface-2);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.84rem;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      .pill-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface);
        padding: 9px 14px;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .pill-btn:hover {
        background: var(--surface-2);
      }

      .pill-btn.danger {
        color: var(--danger);
      }

      .connect-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        border-radius: 9px;
      }

      .connect-alt {
        margin: 8px 0 0;
        font-size: 0.74rem;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .connect-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      @media (max-width: 559px) {
        .connect-card {
          flex-direction: column;
          gap: 12px;
          text-align: center;
        }

        .url-row {
          flex-direction: column;
        }

        .connect-card .connect-hint {
          margin-bottom: 6px;
        }
      }

      /* ---------- Devices card ---------- */

      button.status {
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
        font: inherit;
      }

      button.status:hover #statusText {
        color: var(--text);
      }

      .devices-card {
        margin: 0 16px 10px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .devices-card[hidden] {
        display: none;
      }

      .devices-list {
        list-style: none;
        margin: 8px 0 12px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .devices-list li {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 0.88rem;
      }

      .device-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        flex: 0 0 auto;
      }

      .device-unnamed {
        color: var(--muted);
        font-style: italic;
      }

      .device-you {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        border-radius: 999px;
        padding: 1px 7px;
      }

      .device-rename {
        display: flex;
        gap: 8px;
      }

      .device-rename input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface-2);
        padding: 8px 12px;
        font-size: 0.86rem;
        outline: none;
      }

      .device-rename input:focus {
        border-color: var(--accent);
      }

      .doctor-panel {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .doctor-grid {
        display: grid;
        gap: 7px;
        margin: 9px 0 12px;
      }

      .doctor-row {
        display: grid;
        grid-template-columns: minmax(92px, 0.42fr) minmax(0, 1fr);
        gap: 10px;
        align-items: baseline;
        font-size: 0.8rem;
      }

      .doctor-label {
        color: var(--muted);
      }

      .doctor-value {
        min-width: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .doctor-warnings {
        margin: 0 0 12px;
        padding-left: 18px;
        color: var(--danger);
        font-size: 0.78rem;
      }

      /* ---------- Selection bar ---------- */

      .select-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 16px 10px;
        padding: 8px 8px 8px 14px;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .select-bar[hidden] {
        display: none;
      }

      .stream-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 16px 10px;
      }

      .stream-search,
      .cleanup-select {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        padding: 9px 12px;
        font-size: 0.84rem;
        box-shadow: var(--shadow);
      }

      .stream-search {
        flex: 1;
      }

      .cleanup-select {
        flex: 0 0 auto;
        max-width: 150px;
      }

      @media (max-width: 559px) {
        .stream-tools {
          flex-wrap: wrap;
        }

        .cleanup-select {
          flex: 1;
          max-width: none;
        }
      }

      .select-count {
        font-size: 0.84rem;
        font-weight: 700;
      }

      .select-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .pill-btn.accent {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        color: #fff;
      }

      .pill-btn.accent:hover {
        opacity: 0.93;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      }

      /* ---------- Stream ---------- */

      .stream-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 16px 12px;
        scrollbar-width: thin;
      }

      .stream {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 14vh 24px 0;
      }

      .empty-state svg {
        opacity: 0.35;
        margin-bottom: 10px;
      }

      .empty-title {
        margin: 0 0 6px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
      }

      .empty-body {
        margin: 0 auto;
        max-width: 360px;
        font-size: 0.86rem;
      }

      .item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        animation: item-in 0.22s ease;
      }

      @keyframes item-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      .item-icon {
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      }

      .item-icon.kind-text {
        background: var(--surface-2);
        color: var(--accent);
      }

      button.item-icon {
        border: none;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.15s ease;
      }

      button.item-icon:hover {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
      }

      button.item-icon:active {
        transform: scale(0.94);
      }

      .item.selected {
        border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
        background: color-mix(in srgb, var(--accent) 6%, var(--surface));
      }

      .item-main {
        flex: 1;
        min-width: 0;
      }

      .item-text {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 132px;
        overflow: hidden;
      }

      .item.expanded .item-text {
        max-height: none;
      }

      .expand-btn {
        margin-top: 4px;
        padding: 0;
        border: none;
        background: none;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
      }

      .item-name {
        margin: 0;
        font-weight: 600;
        word-break: break-word;
      }

      .item-meta {
        margin: 2px 0 0;
        font-size: 0.76rem;
        color: var(--muted);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .item-actions {
        flex: 0 0 auto;
        display: flex;
        gap: 2px;
      }

      .item-actions .icon-btn {
        width: 34px;
        height: 34px;
      }

      .icon-btn.danger:hover {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 12%, transparent);
      }

      .icon-btn.ok {
        color: var(--success);
      }

      a.icon-btn {
        text-decoration: none;
      }

      .progress-track {
        margin-top: 8px;
        height: 6px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
        transition: width 0.2s ease;
      }

      /* ---------- Share bar ---------- */

      .sharebar {
        padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
      }

      .sharebar-inner {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .sharebar-inner:focus-within {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      }

      .share-input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        resize: none;
        max-height: 132px;
        padding: 8px 2px;
        line-height: 1.45;
      }

      .share-input::placeholder {
        color: var(--muted);
      }

      .send-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: none;
        border-radius: 13px;
        min-width: 42px;
        height: 42px;
        padding: 0 16px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }

      .send-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .send-btn:not(:disabled):active {
        transform: scale(0.97);
      }

      .share-foot {
        margin: 8px 4px 0;
        text-align: center;
        font-size: 0.72rem;
        color: var(--muted);
      }

      @media (max-width: 419px) {
        .send-label {
          display: none;
        }

        .send-btn {
          padding: 0 13px;
        }

        .share-foot {
          display: none;
        }
      }

      /* ---------- Overlay, toast ---------- */

      .drop-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: var(--overlay);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .drop-overlay[hidden] {
        display: none;
      }

      .drop-overlay-inner {
        pointer-events: none;
        text-align: center;
        color: var(--accent);
        font-size: 1.1rem;
        font-weight: 700;
        border: 2px dashed var(--accent);
        border-radius: 24px;
        padding: 48px 56px;
      }

      /* ---------- thumbnails + lightbox ---------- */

      .item-thumb-wrap {
        position: relative;
        flex: 0 0 auto;
      }

      .item-thumb {
        display: block;
        width: 56px;
        height: 56px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        background: var(--surface-2);
        cursor: zoom-in;
      }

      .item-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .thumb-select {
        position: absolute;
        top: -7px;
        left: -7px;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: transparent;
        cursor: pointer;
        box-shadow: var(--shadow);
      }

      .thumb-select[aria-pressed="true"] {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        color: #fff;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 22px;
        background: rgba(5, 8, 16, 0.88);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .lightbox[hidden] {
        display: none;
      }

      .lightbox img {
        max-width: 94vw;
        max-height: 78vh;
        border-radius: 12px;
        object-fit: contain;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .lightbox-close {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top));
        right: 14px;
        color: #cbd5e1;
        background: rgba(255, 255, 255, 0.08);
      }

      .lightbox-close:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
      }

      .lightbox-caption {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 94vw;
      }

      .lightbox-name {
        color: #e2e8f0;
        font-size: 0.88rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lightbox .pill-btn {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        color: #fff;
        text-decoration: none;
      }

      .pin-gate {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: grid;
        place-items: center;
        background: var(--overlay);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 24px;
      }

      .pin-gate[hidden] {
        display: none;
      }

      .pin-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: min(340px, 100%);
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .pin-title {
        margin: 4px 0 0;
        font-size: 1.05rem;
      }

      .pin-body {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .pin-input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface-2);
        padding: 11px 14px;
        font-size: 1.1rem;
        text-align: center;
        letter-spacing: 0.3em;
        outline: none;
      }

      .pin-input:focus {
        border-color: var(--accent);
      }

      .pin-card .send-btn {
        width: 100%;
      }

      .pin-error {
        margin: 0;
        color: var(--danger);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .item-text a {
        color: var(--accent);
        word-break: break-all;
      }

      /* markdown rendering inside notes */
      .item-text h1,
      .item-text h2,
      .item-text h3 {
        margin: 0 0 4px;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .item-text h1 {
        font-size: 1.08rem;
      }

      .item-text h2 {
        font-size: 1rem;
      }

      .item-text h3 {
        font-size: 0.94rem;
      }

      .item-text p {
        margin: 0 0 6px;
      }

      .item-text > :last-child {
        margin-bottom: 0;
      }

      .item-text ul,
      .item-text ol {
        margin: 0 0 6px;
        padding-left: 20px;
        white-space: normal;
      }

      .item-text code {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85em;
      }

      .item-text pre {
        margin: 0 0 6px;
        padding: 10px 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        line-height: 1.45;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(86px + env(safe-area-inset-bottom));
        transform: translate(-50%, 12px);
        z-index: 60;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--toast-bg);
        color: var(--toast-text);
        font-size: 0.84rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
        max-width: min(86vw, 480px);
        text-align: center;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (min-width: 760px) {
        .topbar,
        .stream-wrap,
        .sharebar {
          padding-left: 20px;
          padding-right: 20px;
        }

        .connect-card {
          margin-left: 20px;
          margin-right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <section class="brand">
          <svg width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="hg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/>
              </linearGradient>
            </defs>
            <path d="M32 4.5 C32 4.5 11.5 28 11.5 41 a20.5 20.5 0 0 0 41 0 C52.5 28 32 4.5 32 4.5 Z" fill="url(#hg)"/>
            <path d="M32 27.5 v15 M23 36 L32 45 41 36" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <div>
            <h1 class="brand-title">DropLocal</h1>
            <button class="status" id="status" type="button" data-state="connecting" aria-expanded="false">
              <span class="status-dot"></span>
              <span id="statusText"></span>
            </button>
          </div>
        </section>
        <section class="top-actions">
          <button class="icon-btn" id="connectToggle" type="button" aria-pressed="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14h1M14 20h1M20 20h1"/></svg>
          </button>
          <select class="lang-select" id="langSelect">
            <option value="en">EN</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
          </select>
          <button class="icon-btn" id="themeToggle" type="button"></button>
        </section>
      </header>

      <section class="connect-card" id="connectCard" hidden>
        <div class="qr-box" id="qrBox" hidden></div>
        <div class="connect-info">
          <h2 class="connect-title" data-i18n="connect.title"></h2>
          <p class="connect-hint" data-i18n="connect.hint"></p>
          <div class="url-row">
            <code class="share-url" id="shareUrl">…</code>
            <button class="pill-btn" id="copyUrlBtn" type="button" data-i18n="connect.copy"></button>
          </div>
          <p class="connect-alt" id="connectAlt" hidden></p>
          <div class="connect-tools">
            <button class="pill-btn accent" id="inviteBtn" type="button" data-i18n="connect.invite"></button>
            <button class="pill-btn" id="doctorBtn" type="button" data-i18n="doctor.title"></button>
          </div>
        </div>
        <button class="icon-btn connect-close" id="connectClose" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </section>

      <section class="devices-card" id="devicesCard" hidden>
        <h2 class="connect-title" data-i18n="devices.title"></h2>
        <ul class="devices-list" id="devicesList"></ul>
        <div class="device-rename">
          <input id="deviceNameInput" maxlength="32" />
          <button class="pill-btn accent" id="deviceNameSave" type="button" data-i18n="devices.save"></button>
        </div>
        <div class="doctor-panel" id="doctorPanel" hidden>
          <h2 class="connect-title" data-i18n="doctor.title"></h2>
          <div class="doctor-grid" id="doctorGrid"></div>
          <ul class="doctor-warnings" id="doctorWarnings" hidden></ul>
          <button class="pill-btn" id="copyDebugBtn" type="button" data-i18n="doctor.copyDebug"></button>
        </div>
      </section>

      <div class="stream-tools">
        <input class="stream-search" id="searchInput" type="search" data-i18n-placeholder="search.placeholder" />
        <select class="cleanup-select" id="cleanupSelect" aria-label="Cleanup">
          <option value="" data-i18n="cleanup.choose"></option>
          <option value="notes" data-i18n="cleanup.notes"></option>
          <option value="files" data-i18n="cleanup.files"></option>
          <option value="older-day" data-i18n="cleanup.olderDay"></option>
          <option value="all" data-i18n="cleanup.all"></option>
        </select>
        <button class="pill-btn" id="cleanupBtn" type="button" data-i18n="cleanup.clear"></button>
      </div>

      <div class="select-bar" id="selectBar" hidden>
        <span class="select-count" id="selectCount"></span>
        <div class="select-actions">
          <button class="pill-btn" id="selectAllBtn" type="button" data-i18n="sel.all"></button>
          <button class="pill-btn accent" id="zipBtn" type="button" data-i18n="sel.zip"></button>
          <button class="pill-btn danger" id="deleteSelectedBtn" type="button" data-i18n="sel.delete"></button>
          <button class="icon-btn" id="selectClearBtn" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

      <main class="stream-wrap" id="streamWrap">
        <div class="empty-state" id="emptyState" hidden>
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M32 4.5 C32 4.5 11.5 28 11.5 41 a20.5 20.5 0 0 0 41 0 C52.5 28 32 4.5 32 4.5 Z" fill="currentColor"/>
          </svg>
          <h2 class="empty-title" data-i18n="empty.title"></h2>
          <p class="empty-body" data-i18n="empty.body"></p>
        </div>
        <ol class="stream" id="stream" aria-live="polite"></ol>
      </main>

      <footer class="sharebar">
        <div class="sharebar-inner">
          <button class="icon-btn" id="attachBtn" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21.4 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l8.57-8.57a4 4 0 015.66 5.66l-8.59 8.57a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea class="share-input" id="shareInput" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" type="button" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <span class="send-label" data-i18n="share.send"></span>
          </button>
        </div>
        <p class="share-foot" id="shareHint"></p>
        <input type="file" id="fileInput" multiple hidden />
      </footer>
    </div>

    <div class="drop-overlay" id="dropOverlay" hidden>
      <div class="drop-overlay-inner" id="dropOverlayText"></div>
    </div>
    <div class="pin-gate" id="pinGate" hidden>
      <form class="pin-card" id="pinForm">
        <svg width="44" height="44" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="pg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/>
            </linearGradient>
          </defs>
          <path d="M32 4.5 C32 4.5 11.5 28 11.5 41 a20.5 20.5 0 0 0 41 0 C52.5 28 32 4.5 32 4.5 Z" fill="url(#pg)"/>
          <path d="M32 27.5 v15 M23 36 L32 45 41 36" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <h2 class="pin-title" data-i18n="pin.title"></h2>
        <p class="pin-body" data-i18n="pin.body"></p>
        <input class="pin-input" id="pinInput" inputmode="numeric" autocomplete="one-time-code" />
        <button class="send-btn" id="pinSubmit" type="submit">
          <span data-i18n="pin.submit"></span>
        </button>
        <p class="pin-error" id="pinError" hidden data-i18n="pin.wrong"></p>
      </form>
    </div>
    <div class="lightbox" id="lightbox" hidden>
      <button class="icon-btn lightbox-close" id="lightboxClose" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <img id="lightboxImg" alt="" />
      <div class="lightbox-caption">
        <span class="lightbox-name" id="lightboxName"></span>
        <a class="pill-btn" id="lightboxDownload" href="#" data-i18n="item.download"></a>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>

    <script>
      (function () {
        "use strict";

        var I18N = JSON.parse(document.getElementById("i18n-data").textContent);
        var SUPPORTED_LANGS = ["en", "zh", "ja", "ko", "es", "de", "fr"];
        var IS_MAC = /mac|iphone|ipad|ipod/i.test(navigator.platform || navigator.userAgent);

        var refs = {
          status: document.getElementById("status"),
          statusText: document.getElementById("statusText"),
          connectToggle: document.getElementById("connectToggle"),
          connectCard: document.getElementById("connectCard"),
          connectClose: document.getElementById("connectClose"),
          qrBox: document.getElementById("qrBox"),
          shareUrl: document.getElementById("shareUrl"),
          connectAlt: document.getElementById("connectAlt"),
          copyUrlBtn: document.getElementById("copyUrlBtn"),
          inviteBtn: document.getElementById("inviteBtn"),
          doctorBtn: document.getElementById("doctorBtn"),
          langSelect: document.getElementById("langSelect"),
          themeToggle: document.getElementById("themeToggle"),
          stream: document.getElementById("stream"),
          streamWrap: document.getElementById("streamWrap"),
          devicesCard: document.getElementById("devicesCard"),
          devicesList: document.getElementById("devicesList"),
          deviceNameInput: document.getElementById("deviceNameInput"),
          deviceNameSave: document.getElementById("deviceNameSave"),
          doctorPanel: document.getElementById("doctorPanel"),
          doctorGrid: document.getElementById("doctorGrid"),
          doctorWarnings: document.getElementById("doctorWarnings"),
          copyDebugBtn: document.getElementById("copyDebugBtn"),
          searchInput: document.getElementById("searchInput"),
          cleanupSelect: document.getElementById("cleanupSelect"),
          cleanupBtn: document.getElementById("cleanupBtn"),
          selectBar: document.getElementById("selectBar"),
          selectCount: document.getElementById("selectCount"),
          selectAllBtn: document.getElementById("selectAllBtn"),
          zipBtn: document.getElementById("zipBtn"),
          deleteSelectedBtn: document.getElementById("deleteSelectedBtn"),
          selectClearBtn: document.getElementById("selectClearBtn"),
          emptyState: document.getElementById("emptyState"),
          attachBtn: document.getElementById("attachBtn"),
          fileInput: document.getElementById("fileInput"),
          shareInput: document.getElementById("shareInput"),
          sendBtn: document.getElementById("sendBtn"),
          shareHint: document.getElementById("shareHint"),
          dropOverlay: document.getElementById("dropOverlay"),
          dropOverlayText: document.getElementById("dropOverlayText"),
          lightbox: document.getElementById("lightbox"),
          lightboxImg: document.getElementById("lightboxImg"),
          lightboxName: document.getElementById("lightboxName"),
          lightboxDownload: document.getElementById("lightboxDownload"),
          lightboxClose: document.getElementById("lightboxClose"),
          pinGate: document.getElementById("pinGate"),
          pinForm: document.getElementById("pinForm"),
          pinInput: document.getElementById("pinInput"),
          pinError: document.getElementById("pinError"),
          toast: document.getElementById("toast")
        };

        var state = {
          lang: "en",
          items: new Map(),
          uploads: new Map(),
          ws: null,
          wsAttempts: 0,
          deviceCount: 0,
          wsState: "connecting",
          shareUrl: "",
          toastTimer: 0,
          expanded: new Set(),
          selected: new Set(),
          devices: [],
          diagnostics: null,
          query: "",
          clientId: "",
          locked: false
        };

        /* ---------- device identity ---------- */

        function loadClientId() {
          try {
            var stored = localStorage.getItem("droplocal-client-id");
            if (stored) {
              return stored;
            }
            var fresh =
              window.crypto && crypto.randomUUID
                ? crypto.randomUUID()
                : "c-" + Date.now() + "-" + Math.random().toString(36).slice(2);
            localStorage.setItem("droplocal-client-id", fresh);
            return fresh;
          } catch (_e) {
            return "c-" + Math.random().toString(36).slice(2);
          }
        }

        function defaultDeviceName() {
          var ua = navigator.userAgent || "";
          if (/iPhone/.test(ua)) return "iPhone";
          if (/iPad/.test(ua)) return "iPad";
          if (/Android/.test(ua)) return "Android";
          if (/Macintosh/.test(ua)) return "Mac";
          if (/Windows/.test(ua)) return "Windows PC";
          if (/Linux/.test(ua)) return "Linux";
          return "Device";
        }

        function deviceName() {
          try {
            return localStorage.getItem("droplocal-device-name") || defaultDeviceName();
          } catch (_e) {
            return defaultDeviceName();
          }
        }

        function sendHello() {
          if (state.ws && state.ws.readyState === WebSocket.OPEN) {
            state.ws.send(
              JSON.stringify({ type: "hello", name: deviceName(), clientId: state.clientId })
            );
          }
        }

        function renderDevices() {
          refs.devicesList.textContent = "";
          state.devices.forEach(function (device) {
            var li = document.createElement("li");
            var dot = document.createElement("span");
            dot.className = "device-dot";
            li.appendChild(dot);

            var label = document.createElement("span");
            if (device.name) {
              label.textContent = device.name;
            } else {
              label.textContent = t("devices.unnamed");
              label.className = "device-unnamed";

        function formatRelativeTime(isoString) {

          var abs = Math.abs(diffSeconds);
          if (abs < 45) {

          try {
            rtf = new Intl.RelativeTimeFormat(intlLocale(), { numeric: "auto" });
          } catch (_e) {
            rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
          }
          if (abs < 3600) {
            return rtf.format(Math.round(diffSeconds / 60), "minute");
          }
          if (abs < 86400) {
            return rtf.format(Math.round(diffSeconds / 3600), "hour");
          }
          if (abs < 604800) {
            return rtf.format(Math.round(diffSeconds / 86400), "day");
          }
          try {
            return new Intl.DateTimeFormat(intlLocale(), { month: "short", day: "numeric" }).format(then);
          } catch (_e) {

        var URL_PATTERN = /(https?:\/\/[^\s<>"']+)/g;

            for (var i = 0; i < INLINE_PATTERNS.length; i += 1) {

            if (!best) {
              appendLinkified(node, remaining);
              return;
            }
            if (best.match.index > 0) {
              appendLinkified(node, remaining.slice(0, best.match.index));
            }
            node.appendChild(best.pattern.make(best.match));
            remaining = remaining.slice(best.match.index + best.match[0].length);

        function renderMarkdownBlocks(container, text) {

              paragraph = [];

            if (list) {
              container.appendChild(list.el);
              list = null;

            var line = lines[i];
            var heading = line.match(/^(#{1,3})\s+(.*)/);
            var bullet = line.match(/^[-*]\s+(.*)/);
            var numbered = line.match(/^\d+\.\s+(.*)/);

              flushParagraph();
              flushList();

              appendInline(headingEl, heading[2]);
              container.appendChild(headingEl);

        function buildUploadItem(upload, uploadId) {
          var li = document.createElement("li");
          li.className = "item";

          var icon = document.createElement("div");
          icon.className = "item-icon";
          icon.innerHTML = fileIcon(upload.name);

          var main = document.createElement("div");
          main.className = "item-main";

          var name = document.createElement("p");
          name.className = "item-name";
          name.textContent = upload.name;
          main.appendChild(name);

          var meta = document.createElement("p");
          meta.className = "item-meta";
          meta.textContent = t("item.uploading") + " " + Math.round(upload.progress * 100) + "%";
          main.appendChild(meta);

          var track = document.createElement("div");
          track.className = "progress-track";
          var fill = document.createElement("div");
          fill.className = "progress-fill";
          fill.style.width = Math.round(upload.progress * 100) + "%";
          track.appendChild(fill);
          main.appendChild(track);

          var actions = document.createElement("div");
          actions.className = "item-actions";
          var cancelBtn = iconButton(t("item.cancel"), ICONS.trash, "danger");
          cancelBtn.addEventListener("click", function () {
            var entry = state.uploads.get(uploadId);
            if (entry && entry.xhr) {
              entry.xhr.abort();
            }
            state.uploads.delete(uploadId);
            renderStream();
          });
          actions.appendChild(cancelBtn);

          li.appendChild(icon);
          li.appendChild(main);
          li.appendChild(actions);
          return li;
        }

        function renderSelectBar() {
          // Selection can only contain files that still exist.
          state.selected.forEach(function (id) {
            var item = state.items.get(id);
            if (!item || item.kind !== "file") {
              state.selected.delete(id);
            }
          });

          var count = state.selected.size;
          refs.selectBar.hidden = count === 0;
          if (count > 0) {
            refs.selectCount.textContent = t("sel.count", { count: count });
          }
        }

        function itemMatchesQuery(item) {
          var query = state.query.trim().toLowerCase();
          if (!query) {
            return true;
          }
          var haystack = item.kind === "text" ? item.text : item.name;
          return String(haystack || "").toLowerCase().indexOf(query) !== -1;
        }

        function renderStream() {
          var entries = Array.from(state.items.values()).filter(itemMatchesQuery);
          entries.sort(function (left, right) {
            return String(right.timestamp).localeCompare(String(left.timestamp));
          });

          renderSelectBar();
          refs.stream.textContent = "";

          state.uploads.forEach(function (upload, uploadId) {
            refs.stream.appendChild(buildUploadItem(upload, uploadId));
          });

          entries.forEach(function (item) {
            refs.stream.appendChild(item.kind === "text" ? buildTextItem(item) : buildFileItem(item));
          });

          refs.emptyState.hidden = entries.length > 0 || state.uploads.size > 0;
        }

        function refreshTimes() {
          var nodes = document.querySelectorAll(".item-time[data-ts]");
          for (var i = 0; i < nodes.length; i += 1) {
            nodes[i].textContent = formatRelativeTime(nodes[i].dataset.ts);
          }
        }

        /* ---------- data ---------- */

        function addSnippet(snippet) {
          state.items.set(snippet.id, {
            id: snippet.id,
            kind: "text",
            text: snippet.text,
            timestamp: snippet.timestamp
          });
        }

        function addFile(meta) {
          state.items.set(meta.id, {
            id: meta.id,
            kind: "file",
            name: meta.name,
            size: meta.size,
            timestamp: meta.timestamp
          });
        }

        function setLocked(locked) {
          state.locked = locked;
          refs.pinGate.hidden = !locked;
          if (locked) {
            refs.pinInput.focus();
          }
        }

        function loadInitial() {
          Promise.all([fetch("/api/snippets"), fetch("/api/files")])
            .then(function (responses) {
              if (responses.some(function (r) { return r.status === 401; })) {
                setLocked(true);
                return null;
              }
              return Promise.all(
                responses.map(function (r) { return r.ok ? r.json() : []; })
              );
            })
            .then(function (results) {
              if (!results) {
                return;
              }
              state.items.clear();
              state.selected.clear();
              results[0].forEach(addSnippet);
              results[1].forEach(addFile);
              renderStream();
            })
            .catch(function () {
              renderStream();
            });
        }

        function submitPin(event) {
          event.preventDefault();
          var pin = refs.pinInput.value.trim();
          if (!pin) {
            return;
          }
          fetch("/api/auth", {
            method: "POST",
            headers: { "content-type": "application/json" },

          })
            .then(function (response) {
              if (response.ok) {
                refs.pinError.hidden = true;
                refs.pinInput.value = "";
                setLocked(false);
                loadInitial();
                connectSocket();
                refreshConnectInfo();
              } else {
                refs.pinError.hidden = false;

              }

            .catch(function () {
              refs.pinError.hidden = false;
            });
        }

        function inviteTokenFromUrl() {
          try {
            return new URLSearchParams(location.search).get("invite") || "";
          } catch (_e) {
            return "";
          }
        }

        function consumeInviteToken() {
          var invite = inviteTokenFromUrl();
          if (!invite) {
            return Promise.resolve();
          }
          return fetch("/api/auth", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ invite: invite })
          })
            .then(function (response) {
              if (response.ok) {
                try {

                  url.searchParams.delete("invite");

            .catch(function () {});

        function deleteItem(item) {

          fetch(endpoint + encodeURIComponent(item.id), { method: "DELETE" })
            .then(function (response) {
              if (!response.ok) {

            .catch(function () {

        function cleanupEndpoint(value) {

        function deleteSelectedFiles() {

          if (!ids.length || !window.confirm(t("cleanup.confirm"))) {
            return;
          }
          refs.deleteSelectedBtn.disabled = true;
          Promise.all(ids.map(function (id) {
            return fetch("/api/files/" + encodeURIComponent(id), { method: "DELETE" })
              .then(function (response) {
                if (!response.ok && response.status !== 404) {
                  throw new Error("delete failed");

            .then(function () {
              ids.forEach(function (id) {
                state.items.delete(id);
                state.selected.delete(id);
              });

        function sendText() {
          var text = refs.shareInput.value.trim();
          if (!text) {
            return;
          }
          refs.sendBtn.disabled = true;
          fetch("/api/snippets", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text: text })
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("send failed");
              }
              return response.json();
            })
            .then(function (snippet) {
              addSnippet(snippet);
              renderStream();
              refs.shareInput.value = "";
              autogrow();
              refs.shareInput.focus();
            })
            .catch(function () {
              showToast(t("toast.sendFailed"));
            })
            .finally(function () {
              updateSendState();
            });

        function uploadFile(file, displayName) {
          var name = displayName || file.name || "file";
          var uploadId = "upload-" + Date.now() + "-" + Math.random().toString(36).slice(2);

          var formData = new FormData();
          formData.append("file", file, name);

          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/files");
          state.uploads.set(uploadId, { name: name, progress: 0, xhr: xhr });
          renderStream();

          xhr.addEventListener("abort", function () {
            state.uploads.delete(uploadId);
            renderStream();
          });

          xhr.upload.addEventListener("progress", function (event) {
            if (event.lengthComputable) {
              var entry = state.uploads.get(uploadId);
              if (entry) {
                entry.progress = event.loaded / event.total;
                renderStream();
              }
            }
          });

          xhr.addEventListener("load", function () {
            state.uploads.delete(uploadId);
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                var payload = JSON.parse(xhr.responseText);
                (Array.isArray(payload) ? payload : [payload]).forEach(addFile);
              } catch (_e) {}
            } else {
              showToast(t("toast.uploadFailed", { name: name }));
            }
            renderStream();
          });

          xhr.addEventListener("error", function () {
            state.uploads.delete(uploadId);
            showToast(t("toast.uploadFailed", { name: name }));
            renderStream();
          });

          xhr.send(formData);
        }

        function uploadFiles(fileList) {
          Array.prototype.forEach.call(fileList, function (file) {
            uploadFile(file);
          });
        }

        /* ---------- websocket ---------- */

        function connectSocket() {
          if (state.locked) {
            return;
          }
          var protocol = location.protocol === "https:" ? "wss" : "ws";
          var socket = new WebSocket(protocol + "://" + location.host + "/ws");
          state.ws = socket;

          socket.addEventListener("open", function () {
            state.wsAttempts = 0;
            state.wsState = "live";
            renderStatus();
            sendHello();
          });

          socket.addEventListener("message", function (event) {
            var envelope;
            try {
              envelope = JSON.parse(event.data);
            } catch (_e) {
              return;
            }

            if (envelope.event === "device:count") {
              state.deviceCount = envelope.data.count;
              renderStatus();
            } else if (envelope.event === "device:list") {
              state.devices = envelope.data.devices || [];
              renderDevices();
            } else if (envelope.event === "snippet:new") {
              addSnippet(envelope.data);
              renderStream();
            } else if (envelope.event === "snippet:delete") {
              state.items.delete(envelope.data.id);
              renderStream();
            } else if (envelope.event === "file:new") {
              addFile(envelope.data);
              renderStream();
            } else if (envelope.event === "file:delete") {
              state.items.delete(envelope.data.id);
              renderStream();
            }
          });

          socket.addEventListener("close", function () {
            if (state.locked) {
              return;
            }
            state.wsState = "offline";
            renderStatus();
            state.wsAttempts += 1;
            var delay = Math.min(1000 * Math.pow(2, state.wsAttempts), 8000);
            window.setTimeout(connectSocket, delay);
          });

          socket.addEventListener("error", function () {
            socket.close();
          });
        }

        /* ---------- connect card ---------- */

        function isLoopbackHost(hostname) {
          return (
            hostname === "localhost" ||
            hostname === "127.0.0.1" ||
            hostname === "[::1]" ||
            hostname.indexOf("127.") === 0
          );
        }

        function setConnectOpen(open) {
          refs.connectCard.hidden = !open;
          refs.connectToggle.setAttribute("aria-pressed", String(open));
          try {
            localStorage.setItem("droplocal-connect", open ? "open" : "closed");
          } catch (_e) {}
        }

        function renderQr(url) {
          if (typeof qrcode !== "function") {
            refs.qrBox.hidden = true;
            return;
          }
          try {
            var qr = qrcode(0, "M");
            qr.addData(url);
            qr.make();
            refs.qrBox.innerHTML = qr.createSvgTag(4, 0);
            refs.qrBox.hidden = false;
          } catch (_e) {
            refs.qrBox.hidden = true;
          }
        }

        function setupConnectCard() {
          var stored = "open";
          try {
            stored = localStorage.getItem("droplocal-connect") || "open";
          } catch (_e) {}
          setConnectOpen(stored !== "closed");

          var fallbackUrl = location.origin;
          state.shareUrl = fallbackUrl;
          // Keep the http:// scheme visible: mobile Safari upgrades a
          // scheme-less typed address to https://, which a LAN HTTP server
          // can't answer. Showing the scheme makes copy-by-eye typing work.
          refs.shareUrl.textContent = fallbackUrl;
          if (!isLoopbackHost(location.hostname)) {
            renderQr(fallbackUrl);
          }

          refreshConnectInfo();
        }

        function refreshConnectInfo() {
          fetch("/api/info")
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .then(function (info) {
              if (!info || !info.urls || !info.urls.primary) {
                return;
              }
              var ipUrl = isLoopbackHost(location.hostname) ? info.urls.primary : location.origin;
              var displayUrl = info.urls.friendly || ipUrl;
              state.shareUrl = displayUrl;
              refs.shareUrl.textContent = displayUrl;
              // The QR always encodes the IP URL — Android browsers can't
              // reliably resolve .local names.
              renderQr(ipUrl);
              if (info.urls.friendly && info.urls.friendly !== ipUrl) {
                refs.connectAlt.textContent = ipUrl;
                refs.connectAlt.hidden = false;
              } else {
                refs.connectAlt.hidden = true;
              }
            })
            .catch(function () {});
        }

        function doctorRows(diagnostics) {

          var reachability = diagnostics.reachability && diagnostics.reachability.ok
            ? t("doctor.ok")
            : t("doctor.failed");

            [t("doctor.primary"), diagnostics.primaryUrl || state.shareUrl || "—"],
            [t("doctor.friendly"), friendly],
            [t("doctor.mdns"), diagnostics.mdns && diagnostics.mdns.available ? t("doctor.ok") : t("doctor.failed")],
            [t("doctor.reachability"), reachability],

        function refreshDiagnostics() {
          return fetch("/api/diagnostics")
            .then(function (response) {
              if (response.status === 401) {
                setLocked(true);
                return null;
              }
              return response.ok ? response.json() : null;
            })
            .then(function (diagnostics) {

        function debugInfoText(diagnostics) {
          var lines = [
            "DropLocal " + (diagnostics.version || ""),
            "Primary: " + (diagnostics.primaryUrl || ""),
            "Friendly: " + (diagnostics.friendlyUrl || ""),
            "Selected interface: " + (diagnostics.selectedInterface || ""),
            "Preferred interface: " + (diagnostics.preferredInterface || ""),
            "PIN enabled: " + (diagnostics.pinEnabled ? "yes" : "no"),
            "Local check: " + (diagnostics.reachability && diagnostics.reachability.ok ? "ok" : "failed"),
            "Upload dir: " + (diagnostics.uploadDir || "")

        /* ---------- share input ---------- */

        function autogrow() {
          refs.shareInput.style.height = "auto";
          refs.shareInput.style.height = Math.min(refs.shareInput.scrollHeight, 132) + "px";
        }

        function updateSendState() {
          refs.sendBtn.disabled = refs.shareInput.value.trim().length === 0;

        /* ---------- drag & drop / paste ---------- */

        var dragDepth = 0;

        function hasFiles(event) {
          var types = event.dataTransfer && event.dataTransfer.types;
          return Boolean(types && Array.prototype.indexOf.call(types, "Files") !== -1);
        }

        function setupDragDrop() {
          document.addEventListener("dragenter", function (event) {
            if (!hasFiles(event)) {
              return;
            }
            event.preventDefault();
            dragDepth += 1;
            refs.dropOverlay.hidden = false;
          });

          document.addEventListener("dragover", function (event) {
            if (hasFiles(event)) {
              event.preventDefault();
            }
          });

          document.addEventListener("dragleave", function (event) {
            if (!hasFiles(event)) {
              return;
            }
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) {
              refs.dropOverlay.hidden = true;
            }
          });

          document.addEventListener("drop", function (event) {
            if (!hasFiles(event)) {
              return;
            }
            event.preventDefault();
            dragDepth = 0;
            refs.dropOverlay.hidden = true;
            handleDroppedItems(event.dataTransfer);
          });
        }

        var MAX_FILES_PER_DROP = 300;

        // Folders drop as directory entries; walk them recursively so a
        // dragged folder uploads every file inside (flattened names).
        function readAllEntries(reader) {
          return new Promise(function (resolve) {
            var collected = [];
            (function batch() {
              reader.readEntries(
                function (entries) {
                  if (!entries.length) {
                    resolve(collected);
                    return;
                  }
                  collected = collected.concat(Array.prototype.slice.call(entries));
                  batch();
                },
                function () {
                  resolve(collected);
                }
              );
            })();
          });
        }

        function collectFilesFromEntry(entry, bucket) {
          return new Promise(function (resolve) {
            if (bucket.length >= MAX_FILES_PER_DROP) {
              resolve();
              return;
            }
            if (entry.isFile) {
              entry.file(
                function (file) {
                  bucket.push(file);
                  resolve();
                },
                function () {
                  resolve();
                }
              );
            } else if (entry.isDirectory) {
              readAllEntries(entry.createReader()).then(function (children) {
                var chain = Promise.resolve();
                children.forEach(function (child) {
                  chain = chain.then(function () {
                    return collectFilesFromEntry(child, bucket);
                  });
                });
                chain.then(resolve);
              });
            } else {
              resolve();
            }
          });
        }

        function handleDroppedItems(dataTransfer) {
          var entries = [];
          if (dataTransfer.items) {
            for (var i = 0; i < dataTransfer.items.length; i += 1) {
              var item = dataTransfer.items[i];
              var entry =
                typeof item.webkitGetAsEntry === "function" ? item.webkitGetAsEntry() : null;
              if (entry) {
                entries.push(entry);
              }
            }
          }

          if (!entries.length) {
            if (dataTransfer.files.length) {
              uploadFiles(dataTransfer.files);
            }
            return;
          }

          var bucket = [];
          var chain = Promise.resolve();
          entries.forEach(function (entry) {
            chain = chain.then(function () {
              return collectFilesFromEntry(entry, bucket);
            });
          });
          chain.then(function () {
            if (bucket.length >= MAX_FILES_PER_DROP) {
              showToast(t("toast.tooMany", { count: MAX_FILES_PER_DROP }));
            }
            bucket.slice(0, MAX_FILES_PER_DROP).forEach(function (file) {
              uploadFile(file);
            });
          });
        }

        function setupPaste() {
          document.addEventListener("paste", function (event) {
            var clipboard = event.clipboardData;
            if (!clipboard) {
              return;
            }

            var imageItems = [];
            for (var i = 0; i < clipboard.items.length; i += 1) {
              var entry = clipboard.items[i];
              if (entry.kind === "file" && entry.type.indexOf("image/") === 0) {
                imageItems.push(entry);
              }
            }

            if (imageItems.length) {
              event.preventDefault();
              imageItems.forEach(function (entry, index) {
                var blob = entry.getAsFile();
                if (!blob) {
                  return;
                }
                var ext = (blob.type.split("/")[1] || "png").replace("jpeg", "jpg");
                var stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
                var suffix = imageItems.length > 1 ? "-" + (index + 1) : "";
                uploadFile(blob, blob.name && blob.name !== "image.png" ? blob.name : "screenshot-" + stamp + suffix + "." + ext);
              });
              showToast(t("toast.screenshot"));
              return;
            }

            if (document.activeElement !== refs.shareInput) {
              var text = clipboard.getData("text/plain");
              if (text) {
                event.preventDefault();
                refs.shareInput.value = refs.shareInput.value
                  ? refs.shareInput.value + "\n" + text
                  : text;
                refs.shareInput.focus();
                autogrow();
                updateSendState();
              }
            }
          });
        }

        /* ---------- wiring ---------- */

        function setupEvents() {

            applyTheme(next);
          });

          refs.langSelect.addEventListener("change", function () {

                refs.copyUrlBtn.textContent = t("connect.copied");
                window.setTimeout(function () {
                  refs.copyUrlBtn.textContent = t("connect.copy");
                }, 1400);

          refs.inviteBtn.addEventListener("click", copyInviteLink);

          refs.doctorBtn.addEventListener("click", function () {

            refs.doctorPanel.hidden = false;
            refs.status.setAttribute("aria-expanded", "true");
            refs.deviceNameInput.value = deviceName();

            refreshDiagnostics();
          });

          refs.attachBtn.addEventListener("click", function () {
            refs.fileInput.click();
          });

          refs.searchInput.addEventListener("input", function () {
            state.query = refs.searchInput.value;
            renderStream();
          });

          refs.cleanupBtn.addEventListener("click", clearDrops);

          refs.fileInput.addEventListener("change", function () {
            if (refs.fileInput.files.length) {
              uploadFiles(refs.fileInput.files);
              refs.fileInput.value = "";
            }
          });

          refs.sendBtn.addEventListener("click", sendText);

          refs.shareInput.addEventListener("input", function () {
            autogrow();
            updateSendState();
          });

          refs.shareInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
              event.preventDefault();
              sendText();
            }
          });

          refs.pinForm.addEventListener("submit", submitPin);

          refs.selectAllBtn.addEventListener("click", function () {
            state.items.forEach(function (item) {
              if (item.kind === "file") {
                state.selected.add(item.id);
              }
            });
            renderStream();
          });

          refs.selectClearBtn.addEventListener("click", function () {
            state.selected.clear();
            renderStream();
          });

          refs.deleteSelectedBtn.addEventListener("click", deleteSelectedFiles);

          refs.status.addEventListener("click", function () {
            var open = refs.devicesCard.hidden;
            refs.devicesCard.hidden = !open;
            refs.status.setAttribute("aria-expanded", String(open));
            if (open) {
              refs.deviceNameInput.value = deviceName();
              renderDevices();
              if (!refs.doctorPanel.hidden) {
                refreshDiagnostics();
              }
            }
          });

          refs.deviceNameSave.addEventListener("click", function () {
            var name = refs.deviceNameInput.value.trim().slice(0, 32);
            try {
              localStorage.setItem("droplocal-device-name", name);
            } catch (_e) {}
            sendHello();
            showToast(t("devices.saved"));
          });

          refs.copyDebugBtn.addEventListener("click", function () {
            var promise = state.diagnostics ? Promise.resolve(state.diagnostics) : refreshDiagnostics();
            promise.then(function (diagnostics) {
              if (!diagnostics) {
                return;
              }
              copyText(debugInfoText(diagnostics), function (ok) {
                showToast(ok ? t("doctor.debugCopied") : t("toast.copyFailed"));
              });
            });
          });

          refs.lightboxClose.addEventListener("click", closeLightbox);
          refs.lightbox.addEventListener("click", function (event) {
            if (event.target === refs.lightbox) {
              closeLightbox();
            }
          });
          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && !refs.lightbox.hidden) {
              closeLightbox();
            }
          });

          refs.zipBtn.addEventListener("click", function () {
            var ids = Array.from(state.selected);
            if (!ids.length) {
              return;
            }
            var anchor = document.createElement("a");
            anchor.href = "/api/files.zip?ids=" + ids.join(",");
            anchor.download = "";
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            state.selected.clear();
            renderStream();
          });

          window.setInterval(refreshTimes, 30000);
        }

        function registerServiceWorker() {
          if (!("serviceWorker" in navigator) || !window.isSecureContext) {
            return;
          }
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
          });
        }

        /* ---------- init ---------- */

        state.clientId = loadClientId();
        applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
        applyLang(detectLang());
        setupConnectCard();
        setupEvents();
        setupDragDrop();
        setupPaste();
        registerServiceWorker();
        consumeInviteToken().finally(function () {
          loadInitial();
          connectSocket();
          updateSendState();
        });
      })();
    </script>
  </body>
</html>
