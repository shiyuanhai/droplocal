<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropLocal — Drop it local. Pick it up anywhere.</title>
    <meta name="description" content="Share files, screenshots and notes between your own devices over Wi-Fi. No cloud, no accounts — one tiny server, every browser can join." />
    <link rel="canonical" href="https://droplocal.app/" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="alternate" hreflang="en" href="https://droplocal.app/" />
    <link rel="alternate" hreflang="zh-Hans" href="https://droplocal.app/?lang=zh" />
    <link rel="alternate" hreflang="ja" href="https://droplocal.app/?lang=ja" />
    <link rel="alternate" hreflang="x-default" href="https://droplocal.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://droplocal.app/" />
    <meta property="og:title" content="DropLocal — Drop it local. Pick it up anywhere." />
    <meta property="og:description" content="Share files, screenshots and notes between your own devices over Wi-Fi. No cloud, no accounts." />
    <meta property="og:image" content="https://droplocal.app/assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#05070d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #05070d;
        --bg-raise: #0a0e18;
        --surface: rgba(148, 170, 255, 0.04);
        --surface-strong: rgba(148, 170, 255, 0.07);
        --border: rgba(148, 170, 255, 0.13);
        --border-strong: rgba(148, 170, 255, 0.24);
        --text: #eef2fb;
        --muted: #94a0b8;
        --faint: #5d6a85;
        --accent: #6d8bff;
        --accent-2: #38bdf8;
        --grad: linear-gradient(100deg, #38bdf8, #6d8bff 55%, #a78bfa);
        --radius: 14px;
        --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
        --font-body: "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      ::selection { background: rgba(109, 139, 255, 0.35); }

      a { color: inherit; text-decoration: none; }

      .glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(52rem 30rem at 50% -8rem, rgba(72, 110, 255, 0.16), transparent 60%),
          radial-gradient(40rem 26rem at 88% 12rem, rgba(56, 189, 248, 0.07), transparent 65%),
          radial-gradient(36rem 24rem at 8% 30rem, rgba(167, 139, 250, 0.06), transparent 65%);
      }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* ---------- Nav ---------- */
      .nav {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        background: rgba(5, 7, 13, 0.72);
        border-bottom: 1px solid rgba(148, 170, 255, 0.08);
      }
      .nav-inner {
        max-width: 1080px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.01em;
      }
      .brand img { width: 26px; height: 26px; }
      .nav-links {
        display: flex;
        gap: 24px;
        font-size: 14px;
        color: var(--muted);
        margin-left: 8px;
      }
      .nav-links a { transition: color 0.2s; }
      .nav-links a:hover { color: var(--text); }
      .nav-spacer { flex: 1; }
      .nav-gh {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        color: var(--muted);
        transition: color 0.2s;
      }
      .nav-gh:hover { color: var(--text); }
      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%2394a0b8" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>') no-repeat right 10px center;
        border: 1px solid var(--border);
        color: var(--muted);
        font: 500 13px var(--font-body);
        padding: 6px 28px 6px 12px;
        border-radius: 9px;
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
      }
      .lang-select:hover { border-color: var(--border-strong); color: var(--text); }
      .lang-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      @media (max-width: 720px) {
        .nav-links { display: none; }
      }

      /* ---------- Hero ---------- */
      .hero {
        padding: 96px 0 48px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 500 12.5px var(--font-mono);
        letter-spacing: 0.02em;
        color: var(--muted);
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 6px 14px;
        border-radius: 999px;
        margin-bottom: 28px;
      }
      .badge .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
      }
      h1 {
        font-family: var(--font-display);
        font-size: clamp(40px, 6.4vw, 68px);
        line-height: 1.06;
        letter-spacing: -0.03em;
        font-weight: 700;
        margin: 0 auto 22px;
        max-width: 17ch;
      }
      h1 .grad {
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lede {
        max-width: 56ch;
        margin: 0 auto 36px;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 18px);
      }
      .lede strong { color: var(--text); font-weight: 500; }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font: 600 15.5px var(--font-body);
        color: #fff;
        background: linear-gradient(135deg, #4f6bf5, #3b82f6);
        padding: 14px 26px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 0 0 1px rgba(79, 107, 245, 0.25), 0 8px 28px rgba(59, 105, 245, 0.35);
        cursor: pointer;
        transition: box-shadow 0.25s, filter 0.25s;
      }
      .btn-primary:hover {
        filter: brightness(1.1);
        box-shadow: 0 0 0 1px rgba(79, 107, 245, 0.4), 0 10px 36px rgba(59, 105, 245, 0.5);
      }
      .btn-primary:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      .btn-primary svg { flex: none; }
      .btn-primary .sub {
        display: block;
        font: 400 11px var(--font-body);
        opacity: 0.75;
        margin-top: 1px;
      }
      .btn-primary .lines { text-align: left; line-height: 1.25; }

      .npx-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font: 500 14px var(--font-mono);
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 13px 16px;
        transition: border-color 0.2s;
      }
      .npx-pill:hover { border-color: var(--border-strong); }
      .npx-pill .dollar { color: var(--faint); user-select: none; }
      .npx-pill code { color: var(--text); }
      .copy-btn {
        display: inline-flex;
        align-items: center;
        background: none;
        border: none;
        padding: 4px;
        margin: -4px;
        color: var(--faint);
        cursor: pointer;
        transition: color 0.2s;
      }
      .copy-btn:hover { color: var(--text); }
      .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

      .hero-note {
        font-size: 13px;
        color: var(--faint);
      }
      .hero-note a { color: var(--muted); border-bottom: 1px solid var(--border-strong); transition: color 0.2s; }
      .hero-note a:hover { color: var(--text); }

      /* ---------- Screenshot ---------- */
      .shot {
        position: relative;
        margin: 64px auto 0;
        max-width: 880px;
      }
      .shot::before {
        content: "";
        position: absolute;
        inset: -8% -12%;
        background: radial-gradient(46rem 20rem at 50% 45%, rgba(79, 107, 245, 0.22), transparent 65%);
        z-index: -1;
        pointer-events: none;
      }
      .shot-frame {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--bg-raise);
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .shot-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: rgba(148, 170, 255, 0.03);
      }
      .shot-bar i {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--border-strong);
      }
      .shot-bar .addr {
        flex: 1;
        max-width: 230px;
        margin: 0 auto;
        font: 500 11.5px var(--font-mono);
        color: var(--faint);
        background: rgba(148, 170, 255, 0.05);
        border: 1px solid var(--border);
        border-radius: 7px;
        text-align: center;
        padding: 3px 10px;
      }
      .shot-frame img {
        display: block;
        width: 100%;
        height: auto;
      }
      .shot-mobile {
        position: absolute;
        right: -28px;
        bottom: -36px;
        width: 168px;
        border-radius: 22px;
        border: 1px solid var(--border-strong);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        background: var(--bg-raise);
      }
      .shot-mobile img { display: block; width: 100%; height: auto; }
      @media (max-width: 760px) {
        .shot-mobile { display: none; }
      }

      /* ---------- Sections ---------- */
      section { padding: 88px 0 0; }
      .sec-eyebrow {
        font: 500 12.5px var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .sec-title {
        font-family: var(--font-display);
        font-size: clamp(28px, 4vw, 38px);
        letter-spacing: -0.02em;
        font-weight: 600;
        margin: 0 0 14px;
      }
      .sec-sub {
        color: var(--muted);
        max-width: 58ch;
        margin: 0 0 44px;
      }

      /* steps */
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .step {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px 24px 24px;
      }
      .step .num {
        font: 500 13px var(--font-mono);
        color: var(--accent);
        display: block;
        margin-bottom: 14px;
      }
      .step h3 {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      .step p { margin: 0; color: var(--muted); font-size: 14.5px; }
      .step code {
        font: 500 0.92em var(--font-mono);
        color: var(--accent-2);
        background: rgba(56, 189, 248, 0.08);
        padding: 1px 6px;
        border-radius: 5px;
      }
      @media (max-width: 760px) {
        .steps { grid-template-columns: 1fr; }
      }

      /* features */
      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .feature {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        transition: border-color 0.25s, background 0.25s;
      }
      .feature:hover {
        border-color: var(--border-strong);
        background: var(--surface-strong);
      }
      .feature .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px; height: 38px;
        border-radius: 10px;
        background: rgba(109, 139, 255, 0.1);
        border: 1px solid rgba(109, 139, 255, 0.22);
        color: var(--accent);
        margin-bottom: 16px;
      }
      .feature h3 {
        font-family: var(--font-display);
        font-size: 16.5px;
        font-weight: 600;
        margin: 0 0 7px;
        letter-spacing: -0.01em;
      }
      .feature p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
      @media (max-width: 880px) {
        .features { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 560px) {
        .features { grid-template-columns: 1fr; }
      }

      /* ---------- Download ---------- */
      .dl-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .dl-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 0;
        transition: border-color 0.25s, background 0.25s;
      }
      .dl-card:hover { border-color: var(--border-strong); background: var(--surface-strong); }
      .dl-card.is-current { border-color: rgba(109, 139, 255, 0.45); }
      .dl-card .os-icon { color: var(--text); margin-bottom: 16px; }
      .dl-card h3 {
        font-family: var(--font-display);
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 2px;
        letter-spacing: -0.01em;
      }
      .dl-card .arch {
        font: 500 12px var(--font-mono);
        color: var(--faint);
        margin-bottom: 18px;
      }
      .dl-main {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: 600 14px var(--font-body);
        color: var(--text);
        background: rgba(109, 139, 255, 0.13);
        border: 1px solid rgba(109, 139, 255, 0.3);
        border-radius: 10px;
        padding: 11px 16px;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
      }
      .dl-main:hover { background: rgba(109, 139, 255, 0.22); border-color: rgba(109, 139, 255, 0.5); }
      .dl-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .dl-alt {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 13px;
        color: var(--faint);
      }
      .dl-alt a {
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        transition: color 0.2s, border-color 0.2s;
        font-family: var(--font-mono);
        font-size: 12.5px;
      }
      .dl-alt a:hover { color: var(--text); border-color: var(--border-strong); }
      .dl-meta {
        margin-top: auto;
        padding-top: 14px;
        font: 400 12px var(--font-mono);
        color: var(--faint);
      }
      .dl-foot {
        margin-top: 22px;
        font-size: 13.5px;
        color: var(--faint);
      }
      .dl-foot a { color: var(--muted); border-bottom: 1px solid var(--border-strong); transition: color 0.2s; }
      .dl-foot a:hover { color: var(--text); }
      .dl-foot code { font: 500 12.5px var(--font-mono); color: var(--accent-2); }
      @media (max-width: 880px) {
        .dl-grid { grid-template-columns: 1fr; }
      }

      /* ---------- FAQ ---------- */
      .faq { max-width: 720px; }
      .faq details {
        border-bottom: 1px solid var(--border);
      }
      .faq summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        cursor: pointer;
        padding: 20px 4px;
        font-family: var(--font-display);
        font-size: 16.5px;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition: color 0.2s;
      }
      .faq summary::-webkit-details-marker { display: none; }
      .faq summary::after {
        content: "+";
        font: 400 20px var(--font-mono);
        color: var(--faint);
        transition: transform 0.25s;
        flex: none;
      }
      .faq details[open] summary::after { transform: rotate(45deg); }
      .faq summary:hover { color: var(--accent-2); }
      .faq p {
        margin: 0;
        padding: 0 4px 22px;
        color: var(--muted);
        font-size: 14.5px;
        max-width: 64ch;
      }

      /* ---------- Footer ---------- */
      footer {
        margin-top: 96px;
        border-top: 1px solid var(--border);
        padding: 32px 0 44px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 24px;
        font-size: 13.5px;
        color: var(--faint);
      }
      footer .spacer { flex: 1; }
      footer a { color: var(--muted); transition: color 0.2s; }
      footer a:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <nav class="nav">
      <div class="nav-inner">
        <a class="brand" href="#">
          <img src="/assets/logo.svg" alt="" width="26" height="26" />
          DropLocal
        </a>
        <div class="nav-links">
          <a href="#how" data-i18n="nav.how"></a>
          <a href="#features" data-i18n="nav.features"></a>
          <a href="#download" data-i18n="nav.download"></a>
          <a href="#faq">FAQ</a>
        </div>
        <div class="nav-spacer"></div>
        <a class="nav-gh" href="https://github.com/shiyuanhai/droplocal" rel="noopener" aria-label="GitHub repository">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.55v-2.15c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.73-1.53-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.78 1.05.78 2.12v3.14c0 .3.2.66.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
          GitHub
        </a>
        <select class="lang-select" id="langSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </nav>

    <div class="wrap">
      <header class="hero">
        <div class="badge">
          <span class="dot" aria-hidden="true"></span>
          <span id="versionBadge">Open source · MIT</span>
        </div>
        <h1><span data-i18n="hero.line1"></span> <span class="grad" data-i18n="hero.line2"></span></h1>
        <p class="lede" data-i18n="hero.lede"></p>

        <div class="cta-row">
          <a class="btn-primary" id="heroCta" href="https://github.com/shiyuanhai/droplocal/releases/latest" rel="noopener">
            <span id="heroCtaIcon" aria-hidden="true"></span>
            <span class="lines">
              <span id="heroCtaLabel"></span>
              <span class="sub" id="heroCtaSub"></span>
            </span>
          </a>
          <span class="npx-pill">
            <span class="dollar" aria-hidden="true">$</span>
            <code>npx droplocal</code>
            <button type="button" class="copy-btn" id="copyNpx" aria-label="Copy command">
              <svg id="copyIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </span>
        </div>
        <p class="hero-note"><span data-i18n="hero.note"></span> <a href="#download" data-i18n="hero.allplatforms"></a></p>

        <div class="shot">
          <div class="shot-frame">
            <div class="shot-bar" aria-hidden="true">
              <i></i><i></i><i></i>
              <span class="addr">drop.local</span>
            </div>
            <img src="/assets/screenshot-desktop.png" alt="DropLocal desktop app showing a shared drop stream" width="1760" height="1100" loading="eager" />
          </div>
          <div class="shot-mobile">

    </script>
    <script>
      (function () {
        "use strict";

        var REPO = "shiyuanhai/droplocal";
        var RELEASES_PAGE = "https://github.com/" + REPO + "/releases/latest";
        var I18N = JSON.parse(document.getElementById("i18n-data").textContent);
        var SUPPORTED = ["en", "zh", "ja"];
        var select = document.getElementById("langSelect");
        var currentLang = "en";

        /* ---------- i18n ---------- */
        function detectLang() {
          var fromQuery = new URLSearchParams(location.search).get("lang");
          if (fromQuery && SUPPORTED.indexOf(fromQuery) !== -1) return fromQuery;
          try {
            var stored = localStorage.getItem("droplocal-lang");
            if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
          } catch (_e) {}
          var langs = navigator.languages || [navigator.language || "en"];
          for (var i = 0; i < langs.length; i += 1) {
            var l = (langs[i] || "").toLowerCase();
            if (l.indexOf("zh") === 0) return "zh";
            if (l.indexOf("ja") === 0) return "ja";
            if (l.indexOf("en") === 0) return "en";
          }
          return "en";
        }

        function t(key) {
          var table = I18N[currentLang] || I18N.en;
          return table[key] || I18N.en[key] || key;
        }

        function applyLang(lang) {
          currentLang = lang;
          try { localStorage.setItem("droplocal-lang", lang); } catch (_e) {}
          document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
          select.value = lang;
          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i += 1) {
            nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
          }
          applyHeroCta();
        }

        select.addEventListener("change", function () { applyLang(select.value); });

        /* ---------- OS detection ---------- */
        function detectOS() {
          var ua = navigator.userAgent || "";
          var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
          if (/android/i.test(ua) || /iphone|ipad|ipod/i.test(ua)) return "mobile";
          if (/mac/i.test(platform)) return "mac";
          if (/win/i.test(platform)) return "win";
          if (/linux/i.test(platform)) return "linux";
          return "generic";
        }

        var OS = detectOS();

        var OS_ICONS = {
          mac: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>',
          win: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.55l7.36-1V11H3V5.55zM3 18.45V13h7.36v6.45L3 18.45zM11.64 4.4L21 3v8h-9.36V4.4zM21 13v8l-9.36-1.4V13H21z"/></svg>',
          linux: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
          generic: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"/></svg>'
        };

        var heroCta = document.getElementById("heroCta");
        var heroAssetKey = { mac: "dmg", win: "exe", linux: "appimage" }[OS] || null;

        function applyHeroCta() {
          var key = OS === "mobile" || OS === "generic" ? "generic" : OS;
          document.getElementById("heroCtaIcon").innerHTML = OS_ICONS[key];
          document.getElementById("heroCtaLabel").textContent = t("cta." + key);
          document.getElementById("heroCtaSub").textContent = t("cta.sub." + key);
          if (OS === "mobile" || OS === "generic") {
            heroCta.setAttribute("href", "#download");
            heroCta.removeAttribute("rel");
          }
          var cards = document.querySelectorAll(".dl-card");
          for (var i = 0; i < cards.length; i += 1) {
            cards[i].classList.toggle("is-current", cards[i].getAttribute("data-os") === OS);
          }
        }

        /* ---------- Latest release links via GitHub API ---------- */
        var ASSET_PATTERNS = {
          dmg: /aarch64\.dmg$/i,
          exe: /setup\.exe$/i,
          msi: /\.msi$/i,
          appimage: /\.AppImage$/i,
          deb: /\.deb$/i,
          rpm: /\.rpm$/i
        };

        function fmtSize(bytes) {
          return (bytes / 1048576).toFixed(1) + " MB";
        }

        function fillReleaseLinks() {
          fetch("https://api.github.com/repos/" + REPO + "/releases/latest", {
            headers: { Accept: "application/vnd.github+json" }
          })
            .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function (rel) {
              var assets = rel.assets || [];
              Object.keys(ASSET_PATTERNS).forEach(function (key) {
                var asset = null;
                for (var i = 0; i < assets.length; i += 1) {
                  if (ASSET_PATTERNS[key].test(assets[i].name)) { asset = assets[i]; break; }
                }
                if (!asset) return;
                var links = document.querySelectorAll('[data-asset="' + key + '"]');
                for (var j = 0; j < links.length; j += 1) {
                  links[j].setAttribute("href", asset.browser_download_url);
                }
                var meta = document.querySelector('[data-meta="' + key + '"]');
                if (meta) meta.textContent = asset.name + " · " + fmtSize(asset.size);
                if (key === heroAssetKey) {
                  heroCta.setAttribute("href", asset.browser_download_url);
                }
              });
              if (rel.tag_name) {
                document.getElementById("versionBadge").textContent =
                  rel.tag_name + " · Open source · MIT";
              }
            })
            .catch(function () { /* keep releases-page fallback links */ });
        }

        /* ---------- copy npx ---------- */
        var copyBtn = document.getElementById("copyNpx");
        var COPY_SVG = copyBtn.innerHTML;
        var CHECK_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
        copyBtn.addEventListener("click", function () {
          if (!navigator.clipboard) return;
          navigator.clipboard.writeText("npx droplocal").then(function () {
            copyBtn.innerHTML = CHECK_SVG;
            setTimeout(function () { copyBtn.innerHTML = COPY_SVG; }, 1400);
          });
        });

        applyLang(detectLang());
        fillReleaseLinks();
      })();
    </script>
  </body>
</html>
