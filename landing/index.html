    <link rel="preload" as="image" href="/assets/screenshot-desktop.webp" fetchpriority="high" />
    <style>
      :root {
        --bg: #faf9f7;
        --ink: #1a1916;
        --muted: #5f5c55;
        --faint: #8a867c;
        --line: #e7e4dd;
        --line-strong: #d8d4ca;
        --card: #ffffff;
        --accent: #4453e6;
        --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-serif: "Instrument Serif", "Songti SC", "Hiragino Mincho ProN", Georgia, serif;
        --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection { background: rgba(68, 83, 230, 0.14); }

      a { color: inherit; text-decoration: none; }

      .wrap {
        max-width: 1024px;
        margin: 0 auto;
        padding: 0 28px;
      }

      /* ---------- Nav ---------- */
      .nav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(250, 249, 247, 0.92);
        border-bottom: 1px solid var(--line);
      }
      .nav-inner {
        max-width: 1024px;
        margin: 0 auto;
        padding: 15px 28px;
        display: flex;
        align-items: center;
        gap: 30px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: -0.02em;
      }
      .brand img { width: 24px; height: 24px; }
      .nav-links {
        display: flex;
        gap: 26px;
        font-size: 14px;
        color: var(--muted);
      }
      .nav-links a { transition: color 0.15s; }
      .nav-links a:hover { color: var(--ink); }
      .nav-spacer { flex: 1; }
      .nav-gh {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        color: var(--muted);
        transition: color 0.15s;
      }
      .nav-gh:hover { color: var(--ink); }
      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        background: transparent url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%238a867c" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>') no-repeat right 10px center;
        border: 1px solid var(--line-strong);
        color: var(--muted);
        font: 500 13px var(--font-sans);
        padding: 6px 28px 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
      }
      .lang-select:hover { border-color: var(--faint); color: var(--ink); }
      .lang-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      @media (max-width: 720px) {
        .nav-links { display: none; }
      }

      /* ---------- Hero ---------- */
      .hero {
        padding: 108px 0 0;
        text-align: center;
      }
      .pill {
        display: inline-block;
        font: 500 13px var(--font-sans);
        color: var(--muted);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        padding: 5px 14px;
        margin-bottom: 34px;
        transition: color 0.15s, border-color 0.15s;
      }
      a.pill:hover { color: var(--ink); border-color: var(--faint); }
      h1 {
        font-family: var(--font-sans);
        font-size: clamp(42px, 6.6vw, 72px);
        line-height: 1.04;
        letter-spacing: -0.045em;
        font-weight: 600;
        margin: 0 auto 26px;
        max-width: 16ch;
      }
      h1 em {
        font-family: var(--font-serif);
        font-weight: 400;
        font-style: italic;
        letter-spacing: -0.01em;
      }
      .lede {
        max-width: 52ch;
        margin: 0 auto 40px;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 18.5px);
        line-height: 1.6;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font: 500 15px var(--font-sans);
        color: #fff;
        background: var(--ink);
        padding: 13px 24px;
        border-radius: 11px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        box-shadow: 0 1px 2px rgba(26, 25, 22, 0.18);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(26, 25, 22, 0.22);
      }
      .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .btn-primary .sub {
        font-weight: 400;
        font-size: 12.5px;
        opacity: 0.62;
        margin-left: 2px;
      }
      .npx-pill {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font: 500 13.5px var(--font-mono);
        color: var(--muted);
        background: var(--card);
        border: 1px solid var(--line-strong);
        border-radius: 11px;
        padding: 13px 16px;
        transition: border-color 0.15s;
      }
      .npx-pill:hover { border-color: var(--faint); }
      .npx-pill .dollar { color: var(--faint); user-select: none; }
      .npx-pill code { color: var(--ink); font-family: inherit; }
      .copy-btn {
        display: inline-flex;
        align-items: center;
        background: none;
        border: none;
        padding: 4px;
        margin: -4px;
        color: var(--faint);
        cursor: pointer;
        transition: color 0.15s;
      }
      .copy-btn:hover { color: var(--ink); }
      .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

      .hero-note {
        font-size: 13.5px;
        color: var(--faint);
        margin: 0;
      }
      .hero-note a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); transition: color 0.15s; }
      .hero-note a:hover { color: var(--ink); }

      .shot {
        margin: 72px auto 0;
        max-width: 920px;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: var(--card);
        box-shadow: 0 1px 2px rgba(26, 25, 22, 0.04), 0 24px 60px -24px rgba(26, 25, 22, 0.18);
      }
      .shot img { display: block; width: 100%; height: auto; }

      /* ---------- Sections (editorial) ---------- */
      section { padding: 104px 0 0; }
      .rule {
        border-top: 1px solid var(--line);
        padding-top: 26px;
      }
      .kicker {
        font: 500 13px var(--font-sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 14px;
      }
      .sec-title {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.035em;
        font-weight: 600;
        line-height: 1.12;
        margin: 0 0 12px;
        max-width: 22ch;
      }
      .sec-title em {
        font-family: var(--font-serif);
        font-weight: 400;
        font-style: italic;
      }
      .sec-sub {
        color: var(--muted);
        max-width: 54ch;
        margin: 0 0 52px;
        font-size: 16.5px;
      }

      /* how — numbered editorial columns */
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 44px;
      }
      .step {
        border-top: 1px solid var(--line-strong);
        padding-top: 20px;
      }
      .step .num {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 17px;
        color: var(--faint);
        display: block;
        margin-bottom: 10px;
      }
      .step h3 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.015em;
        margin: 0 0 7px;
      }
      .step p { margin: 0; color: var(--muted); font-size: 14.5px; }
      .step code {
        font: 500 0.9em var(--font-mono);
        color: var(--ink);
        background: rgba(26, 25, 22, 0.05);
        padding: 1px 6px;
        border-radius: 5px;
      }
      @media (max-width: 720px) {
        .steps { grid-template-columns: 1fr; gap: 28px; }
      }

      /* features — plain two-column list, hairlines, no cards */
      .feats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        column-gap: 64px;
      }
      .feat {
        display: grid;
        grid-template-columns: 168px 1fr;
        gap: 20px;
        padding: 22px 0;
        border-top: 1px solid var(--line);
      }
      .feat h3 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .feat p { margin: 0; color: var(--muted); font-size: 14.5px; }
      @media (max-width: 860px) {
        .feats { grid-template-columns: 1fr; }
      }
      @media (max-width: 520px) {
        .feat { grid-template-columns: 1fr; gap: 4px; }
      }

      /* download — table rows */
      .dl-rows { border-top: 1px solid var(--line-strong); }
      .dl-row {
        display: grid;
        grid-template-columns: 200px 1fr auto;
        align-items: center;
        gap: 24px;
        padding: 22px 0;
        border-bottom: 1px solid var(--line);
      }
      .dl-row .os {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .dl-row .os svg { color: var(--ink); flex: none; }
      .dl-row .meta {
        font: 400 13px var(--font-mono);
        color: var(--faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dl-row .links {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dl-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: 500 13.5px var(--font-sans);
        color: var(--ink);
        border: 1px solid var(--line-strong);
        background: var(--card);
        border-radius: 9px;
        padding: 8px 14px;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .dl-btn:hover { border-color: var(--faint); box-shadow: 0 2px 8px rgba(26, 25, 22, 0.07); }
      .dl-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .dl-btn.alt {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--muted);
      }
      .dl-foot {
        margin-top: 24px;
        font-size: 13.5px;
        color: var(--faint);
      }
      .dl-foot a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); transition: color 0.15s; }
      .dl-foot a:hover { color: var(--ink); }
      .dl-foot code { font: 500 12.5px var(--font-mono); color: var(--ink); }
      @media (max-width: 760px) {
        .dl-row { grid-template-columns: 1fr; gap: 10px; }
        .dl-row .meta { white-space: normal; }
      }

      /* faq */
      .faq { max-width: 680px; border-top: 1px solid var(--line-strong); }
      .faq details { border-bottom: 1px solid var(--line); }
      .faq summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        cursor: pointer;
        padding: 19px 2px;
        font-size: 15.5px;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition: color 0.15s;
      }
      .faq summary::-webkit-details-marker { display: none; }
      .faq summary::after {
        content: "+";
        font: 300 19px var(--font-sans);
        color: var(--faint);
        transition: transform 0.2s;
        flex: none;
      }
      .faq details[open] summary::after { transform: rotate(45deg); }
      .faq summary:hover { color: var(--accent); }
      .faq p {
        margin: 0;
        padding: 0 2px 20px;
        color: var(--muted);
        font-size: 14.5px;
        max-width: 60ch;
      }

      /* footer */
      footer {
        margin-top: 110px;
        border-top: 1px solid var(--line);
        padding: 30px 0 46px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 26px;
        font-size: 13.5px;
        color: var(--faint);
      }
      footer .spacer { flex: 1; }
      footer a { color: var(--muted); transition: color 0.15s; }
      footer a:hover { color: var(--ink); }
    </style>
  </head>
  <body>

      <div class="nav-inner">

          <img src="/assets/logo.svg" alt="" width="24" height="24" />

    <div class="wrap">
      <header class="hero">
        <a class="pill" id="versionBadge" href="https://github.com/shiyuanhai/droplocal/releases/latest" rel="noopener">Open source · MIT</a>
        <h1><span data-i18n="hero.line1"></span> <em data-i18n="hero.line2"></em></h1>
        <p class="lede" data-i18n="hero.lede"></p>

        <div class="cta-row">
          <a class="btn-primary" id="heroCta" href="https://github.com/shiyuanhai/droplocal/releases/latest" rel="noopener">
            <span id="heroCtaLabel"></span>
            <span class="sub" id="heroCtaSub"></span>
          </a>
          <span class="npx-pill">
            <span class="dollar" aria-hidden="true">$</span>
            <code>npx droplocal</code>

              <svg id="copyIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

      <main>
        <section id="how">
          <div class="rule">
            <p class="kicker" data-i18n="how.eyebrow"></p>
            <h2 class="sec-title" data-i18n-html="how.title"></h2>
            <p class="sec-sub" data-i18n="how.sub"></p>
          </div>
          <div class="steps">
            <div class="step">
              <span class="num">01</span>
              <h3 data-i18n="how.1.title"></h3>
              <p data-i18n="how.1.body"></p>
            </div>
            <div class="step">
              <span class="num">02</span>
              <h3 data-i18n="how.2.title"></h3>
              <p data-i18n="how.2.body"></p>
            </div>
            <div class="step">
              <span class="num">03</span>
              <h3 data-i18n="how.3.title"></h3>
              <p data-i18n="how.3.body"></p>
            </div>
          </div>
        </section>

        <section id="features">
          <div class="rule">
            <p class="kicker" data-i18n="feat.eyebrow"></p>
            <h2 class="sec-title" data-i18n-html="feat.title"></h2>
            <p class="sec-sub" data-i18n="feat.sub"></p>
          </div>
          <div class="feats">
            <div class="feat">
              <h3 data-i18n="feat.nocloud.title"></h3>
              <p data-i18n="feat.nocloud.body"></p>
            </div>
            <div class="feat">
              <h3 data-i18n="feat.devices.title"></h3>
              <p data-i18n="feat.devices.body"></p>
            </div>
            <div class="feat">
              <h3>drop.local</h3>
              <p data-i18n="feat.local.body"></p>
            </div>
            <div class="feat">
              <h3 data-i18n="feat.paste.title"></h3>
              <p data-i18n="feat.paste.body"></p>
            </div>
            <div class="feat">
              <h3 data-i18n="feat.sync.title"></h3>
              <p data-i18n="feat.sync.body"></p>
            </div>
            <div class="feat">
              <h3 data-i18n="feat.oss.title"></h3>
              <p data-i18n="feat.oss.body"></p>
            </div>
          </div>
        </section>

        <section id="download">
          <div class="rule">
            <p class="kicker" data-i18n="dl.eyebrow"></p>
            <h2 class="sec-title" data-i18n-html="dl.title"></h2>
            <p class="sec-sub" data-i18n="dl.sub"></p>

    <script>
      (function () {
        "use strict";

        var REPO = "shiyuanhai/droplocal";
        var I18N = JSON.parse(document.getElementById("i18n-data").textContent);
        var SUPPORTED = ["en", "zh", "ja"];
        var select = document.getElementById("langSelect");
        var currentLang = "en";

        /* ---------- i18n ---------- */
        function detectLang() {
          var fromQuery = new URLSearchParams(location.search).get("lang");
          if (fromQuery && SUPPORTED.indexOf(fromQuery) !== -1) return fromQuery;
          try {
            var stored = localStorage.getItem("droplocal-lang");
            if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
          } catch (_e) {}
          var langs = navigator.languages || [navigator.language || "en"];
          for (var i = 0; i < langs.length; i += 1) {
            var l = (langs[i] || "").toLowerCase();
            if (l.indexOf("zh") === 0) return "zh";
            if (l.indexOf("ja") === 0) return "ja";
            if (l.indexOf("en") === 0) return "en";
          }
          return "en";
        }

        function t(key) {
          var table = I18N[currentLang] || I18N.en;
          return table[key] || I18N.en[key] || key;
        }

        /* i18n-html values are trusted literals from this file's own JSON
           (only <em> markup) — never user input. */
        function applyLang(lang) {
          currentLang = lang;
          try { localStorage.setItem("droplocal-lang", lang); } catch (_e) {}
          document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
          select.value = lang;
          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i += 1) {
            nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
          }
          var htmlNodes = document.querySelectorAll("[data-i18n-html]");
          for (var j = 0; j < htmlNodes.length; j += 1) {
            htmlNodes[j].innerHTML = t(htmlNodes[j].getAttribute("data-i18n-html"));
          }
          applyHeroCta();
        }

        select.addEventListener("change", function () { applyLang(select.value); });

        /* ---------- OS detection ---------- */
        function detectOS() {
          var ua = navigator.userAgent || "";
          var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
          if (/android/i.test(ua) || /iphone|ipad|ipod/i.test(ua)) return "mobile";
          if (/mac/i.test(platform)) return "mac";
          if (/win/i.test(platform)) return "win";
          if (/linux/i.test(platform)) return "linux";
          return "generic";
        }

        var OS = detectOS();
        var heroCta = document.getElementById("heroCta");
        var heroAssetKey = { mac: "dmg", win: "exe", linux: "appimage" }[OS] || null;

        function applyHeroCta() {
          var key = OS === "mobile" || OS === "generic" ? "generic" : OS;
          document.getElementById("heroCtaLabel").textContent = t("cta." + key);
          document.getElementById("heroCtaSub").textContent = t("cta.sub." + key);
          if (OS === "mobile" || OS === "generic") {
            heroCta.setAttribute("href", "#download");
            heroCta.removeAttribute("rel");
          }
        }

        /* ---------- Latest release links via GitHub API ---------- */
        var ASSET_PATTERNS = {
          dmg: /aarch64\.dmg$/i,
          exe: /setup\.exe$/i,
          msi: /\.msi$/i,
          appimage: /\.AppImage$/i,
          deb: /\.deb$/i,
          rpm: /\.rpm$/i
        };

        function fmtSize(bytes) {
          return (bytes / 1048576).toFixed(1) + " MB";
        }

        function fillReleaseLinks() {
          fetch("https://api.github.com/repos/" + REPO + "/releases/latest", {
            headers: { Accept: "application/vnd.github+json" }
          })
            .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function (rel) {
              var assets = rel.assets || [];
              Object.keys(ASSET_PATTERNS).forEach(function (key) {
                var asset = null;
                for (var i = 0; i < assets.length; i += 1) {
                  if (ASSET_PATTERNS[key].test(assets[i].name)) { asset = assets[i]; break; }
                }
                if (!asset) return;
                var links = document.querySelectorAll('[data-asset="' + key + '"]');
                for (var j = 0; j < links.length; j += 1) {
                  links[j].setAttribute("href", asset.browser_download_url);
                }
                var meta = document.querySelector('[data-meta="' + key + '"]');
                if (meta) meta.textContent = asset.name + " · " + fmtSize(asset.size);
                if (key === heroAssetKey) {
                  heroCta.setAttribute("href", asset.browser_download_url);
                }
              });
              if (rel.tag_name) {
                document.getElementById("versionBadge").textContent =
                  rel.tag_name + " · Open source · MIT";
              }
            })
            .catch(function () { /* keep releases-page fallback links */ });
        }

        /* ---------- copy npx ---------- */
        var copyBtn = document.getElementById("copyNpx");
        var COPY_SVG = copyBtn.innerHTML;
        var CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
        copyBtn.addEventListener("click", function () {
          if (!navigator.clipboard) return;
          navigator.clipboard.writeText("npx droplocal").then(function () {
            copyBtn.innerHTML = CHECK_SVG;
            setTimeout(function () { copyBtn.innerHTML = COPY_SVG; }, 1400);
          });
        });

        applyLang(detectLang());
        fillReleaseLinks();
      })();
    </script>
  </body>
