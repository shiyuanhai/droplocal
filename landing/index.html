    <style>
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-2: #eef2f9;
        --text: #0f172a;
        --muted: #5b6b81;
        --border: #e3e9f2;
        --accent-a: #38bdf8;
        --accent-b: #6366f1;
        --accent: #4f6bf5;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 10px 30px rgba(15, 23, 42, 0.07);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: var(--text);
        background:
          radial-gradient(circle at 10% -5%, rgba(56, 189, 248, 0.1), transparent 38%),
          radial-gradient(circle at 95% 5%, rgba(99, 102, 241, 0.09), transparent 42%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      ::selection { background: rgba(99, 102, 241, 0.18); }

      .wrap {
        max-width: 1020px;
        margin: 0 auto;
        padding: 0 22px;
      }

      /* header */
      .site-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
      }
      .site-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: -0.01em;
        color: var(--text);
        text-decoration: none;
      }
      .site-brand img { width: 28px; height: 28px; }
      .head-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 7px 10px;
        cursor: pointer;
      }
      .gh-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 7px 10px;
        border-radius: 10px;
      }
      .gh-link:hover,
      .lang-select:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      /* hero */
      .hero {
        padding: 56px 0 30px;
        text-align: center;
      }
      .pill {
        display: inline-block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 999px;
        padding: 5px 14px;
        margin-bottom: 22px;
        text-decoration: none;
      }
      a.pill:hover { color: var(--text); }
      .hero h1 {
        margin: 0 auto;
        max-width: 720px;
        font-size: clamp(1.9rem, 5.4vw, 3.1rem);
        line-height: 1.15;
        letter-spacing: -0.025em;
      }
      .hero h1 .grad {
        background: linear-gradient(120deg, var(--accent-a), var(--accent-b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero .lede {
        margin: 18px auto 0;
        max-width: 640px;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .cta-row {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 13px;
        padding: 13px 22px;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        border: 1px solid var(--border);
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.15s ease, background 0.15s ease;
      }
      .btn:hover { background: var(--surface-2); }
      .btn:active { transform: scale(0.98); }
      .btn.primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        color: #fff;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
      }
      .btn.primary:hover {
        opacity: 0.93;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      }
      .btn .sub {
        font-weight: 500;
        font-size: 0.78rem;
        opacity: 0.75;
      }
      .npx-box {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 13px;
        padding: 0 8px 0 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92rem;
      }
      .npx-box button {
        border: none;
        background: var(--surface-2);
        color: var(--muted);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        border-radius: 9px;
        padding: 8px 12px;
        margin: 7px 0;
        cursor: pointer;
      }
      .npx-box button:hover { color: var(--text); }
      .hero-note {
        margin-top: 14px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .hero-note a { color: var(--accent); font-weight: 600; text-decoration: none; }
      .hero-note a:hover { text-decoration: underline; }

      /* screenshot */
      .shot {
        margin: 44px auto 0;
        max-width: 880px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .shot-bar {
        display: flex;
        gap: 6px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
      }
      .shot-bar span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--border);
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* sections */
      section { padding: 56px 0 0; }
      .sec-title {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(1.4rem, 3.4vw, 1.9rem);
        letter-spacing: -0.02em;
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .step {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 22px;
        text-align: center;
      }
      .step-num {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        margin-bottom: 12px;
      }
      .step h3 { margin: 0 0 6px; font-size: 1.02rem; }
      .step p,
      .feature p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .step code,
      .faq code {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 0.84em;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .feature {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        padding: 20px;
      }
      .feature h3 {
        margin: 0 0 6px;
        font-size: 0.98rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .feature h3 svg { color: var(--accent); flex: 0 0 auto; }

      /* download */
      .dl-card {
        max-width: 720px;
        margin: 0 auto;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .dl-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 22px;
        flex-wrap: wrap;
      }
      .dl-row + .dl-row { border-top: 1px solid var(--border); }
      .dl-row .os {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 0.98rem;
        min-width: 118px;
      }
      .dl-row .os svg { color: var(--text); flex: 0 0 auto; }
      .dl-row .meta {
        flex: 1;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.76rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .dl-links { display: flex; gap: 8px; }
      .dl-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--accent);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 7px 13px;
        text-decoration: none;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .dl-btn:hover { background: rgba(79, 107, 245, 0.12); }
      .dl-foot {
        margin: 18px auto 0;
        max-width: 720px;
        text-align: center;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .dl-foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
      .dl-foot a:hover { text-decoration: underline; }
      .dl-foot code {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 0.84em;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (max-width: 600px) {
        .dl-row { padding: 16px 18px; }
        .dl-row .meta { display: none; }
        .dl-links { margin-left: auto; }
      }

      /* faq */
      .faq {
        max-width: 720px;
        margin: 0 auto;
      }
      .faq details {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        padding: 16px 18px;
        margin-bottom: 10px;
      }
      .faq summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 0.95rem;
      }
      .faq p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* footer */
      footer {
        margin-top: 64px;
        padding: 26px 0 40px;
        border-top: 1px solid var(--border);
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer a { color: var(--muted); font-weight: 600; }
      footer a:hover { color: var(--text); }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (max-width: 760px) {
        .steps,
        .features {
          grid-template-columns: minmax(0, 1fr);
        }
        .hero { padding-top: 36px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="site-head">
        <a class="site-brand" href="/">
          <img src="/assets/logo.svg" alt="" width="28" height="28" />
          DropLocal
        </a>
        <div class="head-actions">

            <option value="ja">日本語</option>

        </div>
      </header>

      <main>
        <header class="hero">
          <a class="pill" id="versionBadge" href="https://github.com/shiyuanhai/droplocal/releases/latest" rel="noopener">Open source · MIT</a>
          <h1><span data-i18n="hero.line1"></span> <span class="grad" data-i18n="hero.line2"></span></h1>

          <figure class="shot" style="margin-left:auto;margin-right:auto">
            <div class="shot-bar" aria-hidden="true"><span></span><span></span><span></span></div>
            <img src="/assets/screenshot-desktop-v2.webp" alt="DropLocal app showing a shared drop stream and a QR code to connect another device at drop.local" width="2200" height="1440" fetchpriority="high" />
          </figure>

        <section id="how">

              <span class="step-num" aria-hidden="true">2</span>

              <p data-i18n="how.2.body"></p>
            </div>
            <div class="step">
              <span class="step-num" aria-hidden="true">3</span>
              <h3 data-i18n="how.3.title"></h3>
              <p data-i18n="how.3.body"></p>
            </div>
          </div>

            </div>
            <div class="feature">
              <h3><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="17" r="1.6"/><path d="M5.5 12.5a9 9 0 0113 0M2 9a14 14 0 0120 0"/></svg><span>drop.local</span></h3>

    <script>
      (function () {
        "use strict";

        var REPO = "shiyuanhai/droplocal";
        var I18N = JSON.parse(document.getElementById("i18n-data").textContent);
        var SUPPORTED = ["en", "zh", "ja"];
        var select = document.getElementById("langSelect");
        var currentLang = "en";

        function detectLang() {
          var fromQuery = new URLSearchParams(location.search).get("lang");
          if (fromQuery && SUPPORTED.indexOf(fromQuery) !== -1) return fromQuery;
          try {
            var stored = localStorage.getItem("droplocal-lang");
            if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
          } catch (_e) {}
          var langs = navigator.languages || [navigator.language || "en"];
          for (var i = 0; i < langs.length; i += 1) {
            var l = (langs[i] || "").toLowerCase();
            if (l.indexOf("zh") === 0) return "zh";
            if (l.indexOf("ja") === 0) return "ja";
            if (l.indexOf("en") === 0) return "en";
          }
          return "en";
        }

        function t(key) {
          var table = I18N[currentLang] || I18N.en;
          return table[key] || I18N.en[key] || key;
        }

        function applyLang(lang) {
          currentLang = lang;
          try { localStorage.setItem("droplocal-lang", lang); } catch (_e) {}
          document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
          select.value = lang;
          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i += 1) {
            nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
          }
          applyHeroCta();
        }

        select.addEventListener("change", function () { applyLang(select.value); });

        function detectOS() {
          var ua = navigator.userAgent || "";
          var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
          if (/android/i.test(ua) || /iphone|ipad|ipod/i.test(ua)) return "mobile";
          if (/mac/i.test(platform)) return "mac";
          if (/win/i.test(platform)) return "win";
          if (/linux/i.test(platform)) return "linux";
          return "generic";
        }

        var OS = detectOS();
        var heroCta = document.getElementById("heroCta");
        var heroAssetKey = { mac: "dmg", win: "exe", linux: "appimage" }[OS] || null;

        function applyHeroCta() {
          var key = OS === "mobile" || OS === "generic" ? "generic" : OS;
          document.getElementById("heroCtaLabel").textContent = t("cta." + key);
          document.getElementById("heroCtaSub").textContent = t("cta.sub." + key);
          if (OS === "mobile" || OS === "generic") {
            heroCta.setAttribute("href", "#download");
            heroCta.removeAttribute("rel");
          }
        }

        var ASSET_PATTERNS = {
          dmg: /aarch64\.dmg$/i,
          exe: /setup\.exe$/i,
          msi: /\.msi$/i,
          appimage: /\.AppImage$/i,
          deb: /\.deb$/i,
          rpm: /\.rpm$/i
        };

        function fmtSize(bytes) {
          return (bytes / 1048576).toFixed(1) + " MB";
        }

        function fillReleaseLinks() {
          fetch("https://api.github.com/repos/" + REPO + "/releases/latest", {
            headers: { Accept: "application/vnd.github+json" }
          })
            .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function (rel) {
              var assets = rel.assets || [];
              Object.keys(ASSET_PATTERNS).forEach(function (key) {
                var asset = null;
                for (var i = 0; i < assets.length; i += 1) {
                  if (ASSET_PATTERNS[key].test(assets[i].name)) { asset = assets[i]; break; }
                }
                if (!asset) return;
                var links = document.querySelectorAll('[data-asset="' + key + '"]');
                for (var j = 0; j < links.length; j += 1) {
                  links[j].setAttribute("href", asset.browser_download_url);
                }
                var meta = document.querySelector('[data-meta="' + key + '"]');
                if (meta) meta.textContent = asset.name + " · " + fmtSize(asset.size);
                if (key === heroAssetKey) {
                  heroCta.setAttribute("href", asset.browser_download_url);
                }
              });
              if (rel.tag_name) {
                document.getElementById("versionBadge").textContent =
                  rel.tag_name + " · Open source · MIT";
              }
            })
            .catch(function () { /* keep releases-page fallback links */ });
        }

        var copyBtn = document.getElementById("copyNpx");
        copyBtn.addEventListener("click", function () {
          var original = copyBtn.textContent;
          function done(ok) {
            copyBtn.textContent = ok ? "✓" : original;
            setTimeout(function () { copyBtn.textContent = original; }, 1200);
          }
          if (navigator.clipboard) {
            navigator.clipboard.writeText("npx droplocal").then(
              function () { done(true); },
              function () { done(false); }
            );
          } else {
            done(false);
          }
        });

        applyLang(detectLang());
        fillReleaseLinks();
      })();
    </script>
