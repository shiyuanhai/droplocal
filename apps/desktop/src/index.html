<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DropLocal Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero card">
        <div class="hero-top">
          <div class="brand-line">
            <svg width="44" height="44" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="dg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/>
                </linearGradient>
              </defs>
              <path d="M32 4.5 C32 4.5 11.5 28 11.5 41 a20.5 20.5 0 0 0 41 0 C52.5 28 32 4.5 32 4.5 Z" fill="url(#dg)"/>
              <path d="M32 27.5 v15 M23 36 L32 45 41 36" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <div>
              <h1>DropLocal</h1>
              <p class="sub" data-i18n="hero.sub"></p>
            </div>
          </div>
          <select class="lang-select" id="langSelect" aria-label="Language">
            <option value="en">EN</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
          </select>
        </div>
        <div class="runtime-grid">
          <article class="metric">
            <p class="metric-label" data-i18n="metric.server"></p>
            <p id="serverState" class="metric-value">…</p>
          </article>
          <article class="metric">
            <p class="metric-label" data-i18n="metric.devices"></p>
            <p id="deviceCount" class="metric-value">0</p>
          </article>
          <article class="metric">
            <p class="metric-label" data-i18n="metric.port"></p>
            <p id="serverPort" class="metric-value">-</p>
          </article>
          <article class="metric">
            <p class="metric-label" data-i18n="metric.uptime"></p>
            <p id="uptime" class="metric-value">-</p>
          </article>
        </div>
        <div class="url-row">
          <label for="primaryUrl" data-i18n="url.label"></label>
          <div class="url-actions">
            <input id="primaryUrl" readonly />
            <button id="copyUrlBtn" type="button" class="btn ghost" data-i18n="url.copy"></button>
            <button id="openBrowserBtn" type="button" class="btn primary" data-i18n="url.open"></button>
          </div>
        </div>
      </section>

      <section class="panel-grid">
        <section class="card qrcode">
          <header>
            <h2 data-i18n="qr.title"></h2>
            <p data-i18n="qr.desc"></p>
          </header>
          <div id="qrCode" class="qr-frame"></div>
        </section>

        <section class="card controls">
          <header>
            <h2 data-i18n="controls.title"></h2>
            <p data-i18n="controls.desc"></p>
          </header>
          <div class="button-grid">
            <button id="toggleServerBtn" type="button" class="btn primary"></button>
            <button id="refreshBtn" type="button" class="btn ghost" data-i18n="controls.refresh"></button>
          </div>
          <p id="runtimeMessage" class="hint"></p>
        </section>
      </section>

      <section class="card settings">
        <header>
          <h2 data-i18n="settings.title"></h2>
          <p data-i18n="settings.desc"></p>
        </header>
        <form id="settingsForm" class="settings-form">
          <label>
            <span data-i18n="settings.port"></span>
            <input id="portInput" name="port" type="number" min="0" max="65535" required />
          </label>
          <label>
            <span data-i18n="settings.storageDir"></span>
            <input id="storageDirInput" name="storageDir" type="text" required />
          </label>
          <label class="check">
            <input id="showQrInput" name="showQrInTray" type="checkbox" />
            <span data-i18n="settings.showQr"></span>
          </label>
          <label class="check">
            <input id="autoCleanInput" name="autoCleanOnQuit" type="checkbox" />
            <span data-i18n="settings.autoClean"></span>
          </label>
          <label class="check">
            <input id="notifyDeviceInput" name="notifyOnDeviceConnect" type="checkbox" />
            <span data-i18n="settings.notify"></span>
          </label>
          <div class="settings-actions">
            <button id="saveSettingsBtn" type="submit" class="btn primary" data-i18n="settings.save"></button>
          </div>
        </form>
      </section>
    </main>
