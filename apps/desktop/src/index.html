<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DropLocal Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <svg width="34" height="34" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="dg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/>
              </linearGradient>
            </defs>
            <path d="M32 4.5 C32 4.5 11.5 28 11.5 41 a20.5 20.5 0 0 0 41 0 C52.5 28 32 4.5 32 4.5 Z" fill="url(#dg)"/>
            <path d="M32 27.5 v15 M23 36 L32 45 41 36" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <div class="brand-text">
            <h1>DropLocal</h1>
            <p class="sub" data-i18n="header.sub"></p>
          </div>
        </div>
        <div class="top-actions">
          <select class="lang-select" id="langSelect" aria-label="Language">
            <option value="en">EN</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
          </select>
          <button class="icon-btn" id="settingsBtn" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <section class="connect">
        <div class="qr-panel">
          <div id="qrCode" class="qr-frame"></div>
        </div>
        <div class="connect-body">
          <div class="status-pill" id="statusPill" data-state="starting">
            <span class="status-dot"></span>
            <span id="statusWord"></span>
          </div>
          <p class="status-line" id="statusLine"></p>

          <label class="url-label" for="primaryUrl" data-i18n="url.label"></label>
          <div class="url-field">
            <input id="primaryUrl" readonly />
          </div>
          <div class="url-actions">
            <button id="copyUrlBtn" type="button" class="btn ghost">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              <span data-i18n="url.copy"></span>
            </button>
            <button id="openBrowserBtn" type="button" class="btn primary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
              <span data-i18n="url.open"></span>
            </button>
            <button id="copyInviteBtn" type="button" class="btn ghost">
              <span data-i18n="doctor.invite"></span>
            </button>
            <button id="copyDebugBtn" type="button" class="btn ghost">
              <span data-i18n="doctor.copyDebug"></span>
            </button>
          </div>
          <p class="connect-hint" data-i18n="connect.scan"></p>
          <div class="desktop-doctor">
            <div class="doctor-grid" id="doctorGrid"></div>
            <p class="doctor-warning" id="doctorWarning" hidden></p>
          </div>
        </div>
      </section>

      <section class="action-row">
        <button id="toggleServerBtn" type="button" class="btn primary big"></button>
        <button id="refreshBtn" type="button" class="icon-btn" aria-label="Refresh">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </section>
    </main>

    <div class="modal-backdrop" id="settingsModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="modal-head">
          <h2 id="settingsTitle" data-i18n="settings.title"></h2>
          <button class="icon-btn" id="settingsClose" type="button" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <form id="settingsForm" class="settings-form">
          <div class="field-grid">
            <label>
              <span data-i18n="settings.port"></span>
              <input id="portInput" name="port" type="number" min="0" max="65535" required />
            </label>
            <label>
              <span data-i18n="settings.expire"></span>
              <input id="expireInput" name="expireMinutes" type="number" min="0" max="10080" />
            </label>
          </div>
          <label>
            <span data-i18n="settings.interface"></span>
            <input id="networkInterfaceInput" name="networkInterface" type="text" />
          </label>
          <label>
            <span data-i18n="settings.storageDir"></span>
            <input id="storageDirInput" name="storageDir" type="text" required />
          </label>
          <label>
            <span data-i18n="settings.pin"></span>
            <input id="pinInput" name="pin" type="text" autocomplete="off" />
          </label>
          <label class="check">
            <input id="autoCleanInput" name="autoCleanOnQuit" type="checkbox" />
            <span data-i18n="settings.autoClean"></span>
          </label>
          <label class="check">
            <input id="notifyDropInput" name="notifyOnNewDrop" type="checkbox" />
            <span data-i18n="settings.notifyDrop"></span>
          </label>
          <label class="check">
            <input id="notifyDeviceInput" name="notifyOnDeviceConnect" type="checkbox" />
            <span data-i18n="settings.notify"></span>
          </label>
          <label class="check">
            <input id="autostartInput" name="launchAtLogin" type="checkbox" />
            <span data-i18n="settings.autostart"></span>
          </label>
          <label class="check" id="dockIconRow" hidden>
            <input id="dockIconInput" name="showDockIcon" type="checkbox" />
            <span data-i18n="settings.dockIcon"></span>
          </label>
          <input id="showQrInput" type="hidden" />
          <p class="settings-desc" data-i18n="settings.desc"></p>
          <div class="modal-actions">
            <button type="button" class="btn ghost" id="settingsCancel" data-i18n="settings.cancel"></button>
            <button id="saveSettingsBtn" type="submit" class="btn primary" data-i18n="settings.save"></button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
