    <style>
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-2: #eef2f9;
        --text: #0f172a;
        --muted: #5b6b81;
        --border: #e3e9f2;
        --accent-a: #38bdf8;
        --accent-b: #6366f1;
        --accent: #4f6bf5;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 10px 30px rgba(15, 23, 42, 0.07);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --surface: #121a2b;
          --surface-2: #1a2438;
          --text: #e6edf7;
          --muted: #8da2bc;
          --border: #243352;
          --accent: #6d8bff;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 34px rgba(0, 0, 0, 0.4);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: var(--text);
        background:
          radial-gradient(circle at 10% -5%, rgba(56, 189, 248, 0.1), transparent 38%),
          radial-gradient(circle at 95% 5%, rgba(99, 102, 241, 0.09), transparent 42%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 1020px;
        margin: 0 auto;
        padding: 0 22px;
      }

      /* header */
      .site-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
      }

      .site-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: -0.01em;
        color: var(--text);
        text-decoration: none;
      }

      .head-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 7px 10px;
        cursor: pointer;
      }

      .gh-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 7px 10px;
        border-radius: 10px;
      }

      .gh-link:hover,
      .lang-select:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      /* hero */
      .hero {
        padding: 56px 0 30px;
        text-align: center;
      }

      .hero h1 {
        margin: 0 auto;
        max-width: 720px;
        font-size: clamp(1.9rem, 5.4vw, 3.1rem);
        line-height: 1.15;
        letter-spacing: -0.025em;
      }

      .hero h1 .grad {
        background: linear-gradient(120deg, var(--accent-a), var(--accent-b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .hero .lede {
        margin: 18px auto 0;
        max-width: 640px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .cta-row {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 13px;
        padding: 13px 22px;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        border: 1px solid var(--border);
        color: var(--text);
        background: var(--surface);
        transition: transform 0.1s ease, opacity 0.15s ease, background 0.15s ease;
      }

      .btn:hover {
        background: var(--surface-2);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn.primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        color: #fff;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
      }

      .btn.primary:hover {
        opacity: 0.93;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      }

      .npx-box {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 13px;
        padding: 0 8px 0 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92rem;
      }

      .npx-box button {
        border: none;
        background: var(--surface-2);
        color: var(--muted);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        border-radius: 9px;
        padding: 8px 12px;
        margin: 7px 0;
        cursor: pointer;
      }

      .npx-box button:hover {
        color: var(--text);
      }

      .hero-note {
        margin-top: 14px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* screenshot */
      .shot {
        margin: 44px auto 0;
        max-width: 880px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .shot-bar {
        display: flex;
        gap: 6px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
      }

      .shot-bar span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--border);
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* sections */
      section {
        padding: 56px 0 0;
      }

      .sec-title {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(1.4rem, 3.4vw, 1.9rem);
        letter-spacing: -0.02em;
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .step {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 22px;
        text-align: center;
      }

      .step-num {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
        margin-bottom: 12px;
      }

      .step h3 {
        margin: 0 0 6px;
        font-size: 1.02rem;
      }

      .step p,
      .feature p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .step code,
      .faq code {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 0.84em;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .feature {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        padding: 20px;
      }

      .feature h3 {
        margin: 0 0 6px;
        font-size: 0.98rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .feature h3 svg {
        color: var(--accent);
        flex: 0 0 auto;
      }

      /* faq */
      .faq {
        max-width: 720px;
        margin: 0 auto;
      }

      .faq details {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        padding: 16px 18px;
        margin-bottom: 10px;
      }

      .faq summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 0.95rem;
      }

      .faq p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* footer */
      footer {
        margin-top: 64px;
        padding: 26px 0 40px;
        border-top: 1px solid var(--border);
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      footer a {
        color: var(--muted);
        font-weight: 600;
      }

      footer a:hover {
        color: var(--text);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (max-width: 760px) {
        .steps,
        .features {
          grid-template-columns: minmax(0, 1fr);
        }

        .hero {
          padding-top: 36px;
        }
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";

        var I18N = JSON.parse(document.getElementById("i18n-data").textContent);
        var SUPPORTED = ["en", "zh", "ja"];
        var select = document.getElementById("langSelect");

        function detect() {
          var fromQuery = new URLSearchParams(location.search).get("lang");
          if (fromQuery && SUPPORTED.indexOf(fromQuery) !== -1) return fromQuery;
          try {
            var stored = localStorage.getItem("droplocal-lang");
            if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
          } catch (_e) {}
          var nav = (navigator.language || "en").toLowerCase();
          if (nav.indexOf("zh") === 0) return "zh";
          if (nav.indexOf("ja") === 0) return "ja";
          return "en";
        }

        function apply(lang) {
          try {
            localStorage.setItem("droplocal-lang", lang);
          } catch (_e) {}
          document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
          select.value = lang;
          var table = I18N[lang] || I18N.en;
          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i += 1) {
            var key = nodes[i].getAttribute("data-i18n");
            nodes[i].textContent = table[key] || I18N.en[key] || key;
          }
        }

        select.addEventListener("change", function () {
          apply(select.value);
        });

        document.getElementById("copyNpx").addEventListener("click", function () {
          var button = this;
          var original = button.textContent;
          function done(ok) {
            button.textContent = ok ? "✓" : original;
            setTimeout(function () {
              button.textContent = original;
            }, 1200);
          }
          if (navigator.clipboard) {
            navigator.clipboard.writeText("npx droplocal").then(
              function () { done(true); },
              function () { done(false); }
            );
          } else {
            done(false);
          }
        });

        apply(detect());
      })();
    </script>
