<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropLocal Downloads</title>
    <style>
      :root {
        --bg: #f7f9f4;
        --card: #ffffff;
        --text: #1f2a1d;
        --muted: #5a6a52;
        --line: #d6ddcc;
        --accent: #226c4f;
        --accent2: #2e8f68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 8%, rgba(46, 143, 104, 0.18), transparent 28%),
          radial-gradient(circle at 85% 5%, rgba(34, 108, 79, 0.12), transparent 28%),
          var(--bg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        width: min(900px, 100%);
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        padding: 22px;
        box-shadow: 0 30px 60px rgba(30, 47, 36, 0.12);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
      }

      p {
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .btn {
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 12px;
        min-height: 48px;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        font-weight: 700;
        background: #f8fbf6;
      }

      .btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        border-color: transparent;
      }

      code {
        display: inline-block;
        background: #f3f7ee;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 8px;
      }

      @media (min-width: 740px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>DropLocal Downloads</h1>
      <p>Share files and text between your devices on the same network. No accounts, no cloud.</p>
      <p id="platformHint">Recommended download selected for your platform.</p>
      <section class="grid">
        <a id="macBtn" class="btn" href="#">Download for macOS</a>
        <a id="windowsBtn" class="btn" href="#">Download for Windows</a>
        <a id="linuxBtn" class="btn" href="#">Download for Linux</a>
      </section>
      <p>CLI quick run: <code>npx droplocal</code></p>
    </main>

    <script>
      const ua = navigator.userAgent.toLowerCase();
      const macBtn = document.getElementById("macBtn");
      const windowsBtn = document.getElementById("windowsBtn");
      const linuxBtn = document.getElementById("linuxBtn");
      const platformHint = document.getElementById("platformHint");
      const owner = location.hostname.endsWith(".github.io")
        ? location.hostname.split(".")[0]
        : "OWNER";
      const repo = location.hostname.endsWith(".github.io")
        ? (location.pathname.split("/")[1] || "REPO")
        : "REPO";
      const releaseUrl = `https://github.com/${owner}/${repo}/releases/latest`;

      [macBtn, windowsBtn, linuxBtn].forEach((button) => {
        button.href = releaseUrl;
      });

      function setPrimary(button, label) {
        [macBtn, windowsBtn, linuxBtn].forEach((entry) => entry.classList.remove("primary"));
        button.classList.add("primary");
        platformHint.textContent = `Recommended: ${label}`;
      }

      if (ua.includes("mac")) {
        setPrimary(macBtn, "macOS desktop build");
      } else if (ua.includes("win")) {
        setPrimary(windowsBtn, "Windows desktop build");
      } else {
        setPrimary(linuxBtn, "Linux desktop build");
      }
    </script>
  </body>
</html>
